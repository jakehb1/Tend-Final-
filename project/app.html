<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>tend Workspace</title>
<script>
  (function () {
    var raw;
    try { raw = sessionStorage.getItem('tend.session'); } catch (_) { raw = null; }
    if (!raw) {
      window.location.replace('login.html');
    }
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="shared.css?v=5">
<style>
html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--fg);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* App top bar */
.app-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 24px;
  border-bottom: 1px solid var(--line);
  background: rgba(10,11,13,0.9);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  flex-shrink: 0;
}
.app-bar .left, .app-bar .right { display: flex; align-items: center; gap: 18px; }
.app-bar .brand img { height: 20px; width: auto; display: block; }
.app-bar .ws-tag {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 11px;
  color: var(--fg-mute);
  letter-spacing: 0.06em;
  border-left: 1px solid var(--line);
  padding-left: 18px;
}
.app-bar .ws-tag strong { color: var(--accent); font-weight: 500; }
.app-bar .user {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 12px;
  color: var(--fg-dim);
  letter-spacing: 0.02em;
}
.app-bar .logout {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 12px;
  color: var(--fg-mute);
  letter-spacing: 0.04em;
  text-decoration: none;
  padding: 6px 12px;
  border: 1px solid var(--line);
  transition: color 0.15s, border-color 0.15s;
}
.app-bar .logout:hover { color: var(--fg); border-color: var(--line-2); }

/* Layout */
.app-shell {
  flex: 1;
  display: grid;
  grid-template-columns: 280px 1fr;
  min-height: 0;
}

/* Sidebar */
.sidebar {
  border-right: 1px solid var(--line);
  background: var(--bg-2);
  overflow-y: auto;
  padding: 24px 0;
  display: flex;
  flex-direction: column;
  gap: 24px;
}
.sb-section { padding: 0 20px; }
.sb-section .h {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 10px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--fg-mute);
  margin-bottom: 12px;
  display: flex; justify-content: space-between; align-items: center;
}
.sb-section .h .count { color: var(--accent); }
.sys-list { display: flex; flex-direction: column; gap: 4px; }
.sys {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 10px;
  border: 1px solid transparent;
  font-size: 13.5px;
  color: var(--fg);
  letter-spacing: -0.005em;
  background: transparent;
  text-align: left;
  font-family: inherit;
  cursor: pointer;
  width: 100%;
  -webkit-appearance: none;
  appearance: none;
}
.sys:hover { border-color: var(--line); background: var(--bg-3); }
.sys .dot {
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--accent);
  flex-shrink: 0;
  box-shadow: 0 0 8px rgba(220,210,180,0.45);
}
.sys.idle .dot { background: var(--fg-mute); box-shadow: none; }
.sys.warn .dot { background: #C29A4D; box-shadow: 0 0 8px rgba(194,154,77,0.5); }
.sys .name { font-size: 13.5px; color: var(--fg); letter-spacing: -0.005em; }
.sys .meta { font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: var(--fg-mute); letter-spacing: 0.04em; }
.sys .sys-text { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.sys .sys-text .sub {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 10px;
  color: var(--fg-mute);
  letter-spacing: 0.03em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.sys.warn .sys-text .sub { color: #C29A4D; }

/* Today's activity panel */
.activity-list { display: flex; flex-direction: column; gap: 8px; }
.activity {
  display: flex;
  align-items: baseline;
  gap: 10px;
  padding: 6px 10px;
  border: 0;
  border-left: 2px solid var(--accent);
  background: var(--bg-3);
  text-align: left;
  font-family: inherit;
  width: 100%;
  cursor: pointer;
  -webkit-appearance: none;
  appearance: none;
  transition: background 0.12s;
}
.activity:hover { background: #1c2026; }
.activity.flag { border-left-color: #C29A4D; }
.activity .num {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 13px;
  color: var(--accent);
  font-weight: 500;
  letter-spacing: 0.02em;
  min-width: 30px;
}
.activity.flag .num { color: #C29A4D; }
.activity .label { font-size: 12px; color: var(--fg-dim); line-height: 1.35; }

.sb-manage {
  display: block;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 11px;
  letter-spacing: 0.06em;
  color: var(--accent);
  text-decoration: none;
  padding: 12px 10px 4px;
  margin-top: 4px;
}
.sb-manage:hover { color: var(--fg); }

.thread-list { display: flex; flex-direction: column; }
.thread {
  padding: 12px 12px;
  border: 0;
  border-left: 2px solid transparent;
  font-size: 13px;
  color: var(--fg-dim);
  cursor: pointer;
  line-height: 1.4;
  background: transparent;
  text-align: left;
  font-family: inherit;
  width: 100%;
  -webkit-appearance: none;
  appearance: none;
}
.thread:hover { color: var(--fg); background: var(--bg-3); }
.thread.active {
  background: var(--bg-3);
  border-left-color: var(--accent);
  color: var(--fg);
}
.thread .when {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 10px;
  color: var(--fg-mute);
  letter-spacing: 0.05em;
  margin-bottom: 4px;
}

/* Chat */
.chat {
  display: flex;
  flex-direction: column;
  min-height: 0;
  position: relative;
}
.chat-head {
  padding: 16px 28px;
  border-bottom: 1px solid var(--line);
  display: flex; justify-content: space-between; align-items: center;
  flex-shrink: 0;
}
.chat-head h1 {
  font-size: 18px;
  font-weight: 400;
  letter-spacing: -0.01em;
  margin: 0;
}
.chat-head .meta {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 11px;
  color: var(--fg-mute);
  letter-spacing: 0.05em;
}
.chat-head .meta .live { color: var(--accent); }

.chat-body {
  flex: 1;
  overflow-y: auto;
  padding: 32px 28px 24px;
  display: flex; flex-direction: column; gap: 24px;
}
.msg { display: flex; gap: 14px; max-width: 760px; }
.msg.user { align-self: flex-end; max-width: 540px; }
.msg .who {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 10px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--fg-mute);
  margin-bottom: 6px;
}
.msg.user .who { color: var(--accent); }
.msg .bubble {
  font-size: 15px;
  line-height: 1.6;
  color: var(--fg);
}
.msg.user .bubble {
  background: var(--bg-2);
  border: 1px solid var(--line);
  padding: 12px 16px;
}
.msg .bubble p { margin: 0 0 10px; }
.msg .bubble p:last-child { margin-bottom: 0; }
.msg .bubble strong { color: var(--accent); font-weight: 500; }

.sources {
  display: flex; flex-wrap: wrap; gap: 6px;
  margin-top: 12px;
}
.src {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 10px;
  letter-spacing: 0.06em;
  color: var(--fg-dim);
  border: 1px solid var(--line);
  padding: 4px 8px;
}
.src::before { content: "● "; color: var(--accent); }

.thinking {
  display: inline-flex; gap: 4px; align-items: center;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 12px;
  color: var(--fg-mute);
  letter-spacing: 0.04em;
}
.thinking .d {
  width: 4px; height: 4px; border-radius: 50%; background: var(--fg-mute);
  animation: pulse 1.2s infinite;
}
.thinking .d:nth-child(2) { animation-delay: 0.15s; }
.thinking .d:nth-child(3) { animation-delay: 0.3s; }
@keyframes pulse {
  0%, 100% { opacity: 0.3; }
  50% { opacity: 1; }
}

/* Composer */
.composer {
  border-top: 1px solid var(--line);
  padding: 16px 28px 20px;
  flex-shrink: 0;
  background: var(--bg);
}
.composer-inner {
  border: 1px solid var(--line-2);
  background: var(--bg-2);
  padding: 12px 14px;
  display: flex; gap: 12px; align-items: flex-end;
}
.composer textarea {
  flex: 1;
  background: transparent;
  border: 0;
  outline: 0;
  resize: none;
  color: var(--fg);
  font-family: 'FH Premier', 'IBM Plex Sans', system-ui, sans-serif;
  font-size: 15px;
  line-height: 1.5;
  min-height: 24px;
  max-height: 160px;
}
.composer textarea::placeholder { color: var(--fg-mute); }
.composer .send {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 12px;
  letter-spacing: 0.04em;
  background: var(--accent);
  color: var(--accent-ink);
  border: 1px solid var(--accent);
  padding: 7px 14px;
  cursor: pointer;
  -webkit-appearance: none;
  appearance: none;
  flex-shrink: 0;
}
.composer .send:hover { filter: brightness(1.08); }
.composer .hints {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 10px;
  color: var(--fg-mute);
  letter-spacing: 0.05em;
  margin-top: 8px;
  display: flex; flex-wrap: wrap; gap: 8px;
}
.hint {
  border: 1px solid var(--line);
  padding: 5px 9px;
  cursor: pointer;
  color: var(--fg-dim);
  background: transparent;
  font: inherit;
  letter-spacing: inherit;
}
.hint:hover { color: var(--fg); border-color: var(--line-2); }

.app-toggle {
  display: none;
  background: transparent;
  border: 1px solid var(--line-2);
  color: var(--fg);
  padding: 7px 10px;
  margin-right: 8px;
  cursor: pointer;
  -webkit-appearance: none;
  appearance: none;
  align-items: center;
  justify-content: center;
}
.app-toggle svg { display: block; }
.app-backdrop {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(10,11,13,0.65);
  backdrop-filter: blur(2px);
  z-index: 40;
}

@media (max-width: 880px) {
  .app-shell { grid-template-columns: 1fr; }
  .chat-body, .composer, .chat-head { padding-left: 18px; padding-right: 18px; }
  .app-bar .ws-tag { display: none; }
  .app-bar .user { display: none; }
  .app-bar .left { gap: 6px; }
  .app-toggle { display: inline-flex; }
  .sidebar {
    position: fixed;
    top: 0; left: 0; bottom: 0;
    width: min(86vw, 320px);
    z-index: 50;
    transform: translateX(-100%);
    transition: transform 0.22s ease;
    border-right: 1px solid var(--line);
    box-shadow: 12px 0 40px rgba(0,0,0,0.45);
  }
  body.drawer-open .sidebar { transform: translateX(0); }
  body.drawer-open .app-backdrop { display: block; }
}
</style>
</head>
<body>

<header class="app-bar">
  <div class="left">
    <button type="button" class="app-toggle" id="app-toggle" aria-controls="sidebar" aria-expanded="false" aria-label="Open sidebar">
      <svg width="18" height="14" viewBox="0 0 18 14" aria-hidden="true"><g stroke="currentColor" stroke-width="1.5" stroke-linecap="square"><line x1="0" y1="2" x2="18" y2="2"/><line x1="0" y1="7" x2="18" y2="7"/><line x1="0" y1="12" x2="18" y2="12"/></g></svg>
    </button>
    <a class="brand" href="index.html"><img src="images/tend-logo.png" alt="tend" /></a>

<div class="app-shell">

        <button type="button" class="activity" data-query="How is Meta Ads doing today?"><span class="num">4.2×</span><span class="label">Meta Ads ROAS today</span></button>
        <button type="button" class="activity" data-query="Show me the abandoned cart recovery"><span class="num">6</span><span class="label">cart recovery emails sent</span></button>
        <button type="button" class="activity" data-query="What SKUs are running low?"><span class="num">3</span><span class="label">low-stock alerts</span></button>
        <button type="button" class="activity flag" data-query="Tell me about the return request you flagged"><span class="num">1</span><span class="label">return request needs you</span></button>
      </div>
    </div>

    <div class="sb-section">
      <div class="h"><span>Connected systems</span><span class="count">7 live</span></div>
      <div class="sys-list">
        <button type="button" class="sys" data-system="Shopify"><span class="dot"></span><div class="sys-text"><div class="name">Shopify</div><div class="sub">2,840 orders · synced 2m ago</div></div></button>
        <button type="button" class="sys" data-system="Klaviyo"><span class="dot"></span><div class="sys-text"><div class="name">Klaviyo</div><div class="sub">38,420 profiles · synced 3m ago</div></div></button>
        <button type="button" class="sys" data-system="Meta Ads"><span class="dot"></span><div class="sys-text"><div class="name">Meta Ads</div><div class="sub">12 campaigns · synced 4m ago</div></div></button>
        <button type="button" class="sys" data-system="Google Ads"><span class="dot"></span><div class="sys-text"><div class="name">Google Ads</div><div class="sub">6 campaigns · synced 5m ago</div></div></button>
        <button type="button" class="sys" data-system="Stripe"><span class="dot"></span><div class="sys-text"><div class="name">Stripe</div><div class="sub">payouts · synced 2m ago</div></div></button>
        <button type="button" class="sys" data-system="QuickBooks"><span class="dot"></span><div class="sys-text"><div class="name">QuickBooks</div><div class="sub">ledger · synced 8m ago</div></div></button>

        <button type="button" class="sys warn" data-system="Postscript"><span class="dot"></span><div class="sys-text"><div class="name">Postscript</div><div class="sub">SMS sync lagging 22m</div></div></button>
        <button type="button" class="sys idle" data-system="Yotpo"><span class="dot"></span><div class="sys-text"><div class="name">Yotpo</div><div class="sub">reviews · paused</div></div></button>

    <div class="sb-section">
      <div class="h"><span>Recent threads</span></div>
      <div class="thread-list" id="thread-list">
        <button type="button" class="thread active" data-thread="briefing">
          <div class="when">TODAY · 09:02</div>
          Morning briefing
        </button>
        <button type="button" class="thread" data-thread="meta">
          <div class="when">TODAY · 08:48</div>

        </button>

        </button>

        </button>

  </aside>

  <main class="chat">

    <div class="composer">
      <form class="composer-inner" id="composer">
        <textarea id="msg-input" rows="1" placeholder="Ask anything across your connected systems…" autocomplete="off"></textarea>
        <button type="submit" class="send">Send →</button>

        <button class="hint" type="button">What's selling best right now?</button>
        <button class="hint" type="button">How is Meta Ads doing this week?</button>
        <button class="hint" type="button">Which SKUs are running low?</button>
        <button class="hint" type="button">How did the Friday newsletter perform?</button>
      </div>
    </div>

</div>

<!--
  Flip apiBase to your bridge URL (e.g. 'https://api.withtend.ai') to route
  the chat composer through OpenClaw via the bridge. Until then we keep
  the existing canned replies so the demo works on the static site.
-->
<script>
  window.__TEND_CONFIG__ = window.__TEND_CONFIG__ || { apiBase: null };
</script>
<script>
(function () {
  var CFG = window.__TEND_CONFIG__ || {};
  var API = CFG.apiBase || null;
  try {
    var raw = sessionStorage.getItem('tend.session');
    if (raw) {
      var sess = JSON.parse(raw);
      if (sess && sess.email) {
        document.getElementById('user-email').textContent = sess.email;
      }
    }
  } catch (_) {}

  var logout = document.getElementById('logout');
  if (logout) {
    logout.addEventListener('click', function (e) {
      e.preventDefault();
      try { sessionStorage.removeItem('tend.session'); } catch (_) {}
      window.location.href = 'index.html';
    });
  }

  var appToggle = document.getElementById('app-toggle');
  var backdrop = document.getElementById('app-backdrop');
  function setDrawer(open) {
    document.body.classList.toggle('drawer-open', open);
    if (appToggle) appToggle.setAttribute('aria-expanded', open ? 'true' : 'false');
  }
  if (appToggle) {
    appToggle.addEventListener('click', function () {
      setDrawer(!document.body.classList.contains('drawer-open'));
    });
  }
  if (backdrop) {
    backdrop.addEventListener('click', function () { setDrawer(false); });
  }
  document.querySelectorAll('#sidebar .thread, #sidebar .sys').forEach(function (n) {
    n.addEventListener('click', function () { setDrawer(false); });
  });

  var body = document.getElementById('chat-body');
  var form = document.getElementById('composer');
  var input = document.getElementById('msg-input');
  var hints = document.getElementById('hints');

  function scroll() { body.scrollTop = body.scrollHeight; }

  function el(tag, className, html) {
    var n = document.createElement(tag);
    if (className) n.className = className;
    if (html != null) n.innerHTML = html;
    return n;
  }

  function addUser(text) {
    var wrap = el('div', 'msg user');
    wrap.innerHTML = '<div><div class="who">you</div><div class="bubble"></div></div>';
    wrap.querySelector('.bubble').textContent = text;
    body.appendChild(wrap);
    scroll();
  }

  function addThinking() {
    var wrap = el('div', 'msg');
    wrap.innerHTML = '<div><div class="who">tend</div><div class="bubble"><span class="thinking">reading across connected systems<span class="d"></span><span class="d"></span><span class="d"></span></span></div></div>';
    body.appendChild(wrap);
    scroll();
    return wrap;
  }

  function addReply(html, sources) {
    var wrap = el('div', 'msg');
    var srcHTML = (sources || []).map(function (s) { return '<div class="src">' + s + '</div>'; }).join('');
    wrap.innerHTML = '<div><div class="who">tend</div><div class="bubble">' + html + (srcHTML ? '<div class="sources">' + srcHTML + '</div>' : '') + '</div></div>';
    body.appendChild(wrap);
    scroll();
  }

  var canned = [
    {
      match: /morning|brief|today|standup|what.*happen|what.*change/i,
      html: "<p>Good morning. Here's what happened since you logged off at 7:14 PM yesterday:</p><p><strong>Revenue.</strong> <strong>47 orders</strong> overnight for <strong>$4,820</strong> (AOV $103). Biggest order: a bundle of two Performance Polos + a Heritage Hat ($248) from a returning customer in Austin. Repeat-rate on overnight orders: 38%.</p><p><strong>Ads.</strong> Meta spent $580 last night at <strong>4.2× ROAS</strong>. The Sage Drop campaign continues to outperform (5.1× ROAS). Glove retargeting is dragging at 2.1×. I'd consider pausing it.</p><p><strong>Email.</strong> Friday's newsletter drove <strong>$1,840</strong> attributed revenue. 32% open rate, 4.1% CTR. The Heritage Hat re-stock callout pulled 22% of the clicks.</p><p><strong>Inventory.</strong> 3 SKUs hit low-stock: Players Glove (M) at 8 units, Heritage Hat (Olive) at 12, Performance Polo (Sage XL) at 6. PO drafted for Glove, waiting on your call for the others.</p><p><strong>Service.</strong> One return request flagged: a customer wants to swap a Performance Polo (Stone) for Cream because the color was different than expected on their monitor. Draft reply ready.</p>",
      sources: ['Shopify · overnight orders', 'Meta Ads · spend report', 'Klaviyo · Friday newsletter', 'Shopify · inventory', 'ShipStation · 1 return']
    },

  function reply(text) {
    if (API) return replyLive(text);

  function replyCanned(text) {

  // Stream from the bridge /api/chat/:user SSE endpoint.
  // Each chunk arrives as {delta: "..."} and we append it to the bubble.
  function replyLive(text) {
    var userEmail = 'demo@withtend.ai';
    try {
      var sraw = sessionStorage.getItem('tend.session');
      if (sraw) {
        var s = JSON.parse(sraw);
        if (s && s.email) userEmail = s.email;
      }
    } catch (_) {}

    var thinking = addThinking();
    var bubble = null;

    function ensureBubble() {
      if (bubble) return bubble;
      thinking.remove();
      var wrap = document.createElement('div');
      wrap.className = 'msg';
      wrap.innerHTML = '<div><div class="who">tend</div><div class="bubble"></div></div>';
      var b = wrap.querySelector('.bubble');
      body.appendChild(wrap);
      bubble = b;
      return b;
    }

    function fail(msg) {
      thinking.remove();
      addReply('<p>Bridge unreachable. Falling back to demo mode.</p><p style="color:var(--fg-mute);font-size:12px;">' + msg + '</p>');
      replyCanned(text);
    }

    fetch(API + '/api/chat/' + encodeURIComponent(userEmail), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text })
    })
    .then(function (r) {
      if (!r.ok || !r.body) throw new Error('http ' + r.status);
      var reader = r.body.getReader();
      var decoder = new TextDecoder();
      var buf = '';
      function pump() {
        return reader.read().then(function (res) {
          if (res.done) return;
          buf += decoder.decode(res.value, { stream: true });
          var lines = buf.split('\n');
          buf = lines.pop() || '';
          for (var i = 0; i < lines.length; i++) {
            var line = lines[i].trim();
            if (!line || !line.startsWith('data:')) continue;
            var payload = line.slice(5).trim();
            if (payload === '[DONE]') return;
            try {
              var obj = JSON.parse(payload);
              if (obj.error) throw new Error(obj.error);
              if (obj.delta) {
                ensureBubble();
                bubble.textContent += obj.delta;
                scroll();
              }
            } catch (e) {
              throw e;
            }
          }
          return pump();
        });
      }
      return pump();
    })
    .catch(function (e) {
      console.warn('replyLive error:', e);
      fail(e.message || 'network error');
    });
  }

  function renderThread(id) {

      if (m.who === 'user') {
        addUser(m.text);
      } else {
        addReply(m.html, m.sources);
      }
    });
    document.querySelectorAll('#thread-list .thread').forEach(function (n) {

    });
    body.scrollTop = 0;
  }
