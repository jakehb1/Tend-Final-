<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>tend Workspace</title>
<script>
  (function () {
    var raw;
    try { raw = sessionStorage.getItem('tend.session'); } catch (_) { raw = null; }
    if (!raw) {
      window.location.replace('login.html');
    }
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="shared.css?v=5">
<style>
/* ----- Light theme override for /app (Claude-style warm light) ----- */
:root {
  --bg:    #FAF9F5;
  --bg-2:  #F4F1EA;
  --bg-3:  #EBE7DC;
  --fg:    #1F1E1B;
  --fg-dim: rgba(31, 30, 27, 0.66);
  --fg-mute: rgba(31, 30, 27, 0.42);
  --line:   rgba(31, 30, 27, 0.08);
  --line-2: rgba(31, 30, 27, 0.18);
  --accent: #2D2A24;
  --accent-ink: #FAF9F5;
  --accent-soft: rgba(45, 42, 36, 0.10);
}
html { background: var(--bg); }

html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--fg);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* App top bar */
.app-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 24px;
  border-bottom: 1px solid var(--line);
  background: rgba(250, 249, 245, 0.92);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  flex-shrink: 0;
}
.app-bar .left, .app-bar .right { display: flex; align-items: center; gap: 18px; }
.app-bar .brand img { height: 20px; width: auto; display: block; filter: brightness(0); }
.app-bar .ws-tag {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 11px;
  color: var(--fg-mute);
  letter-spacing: 0.06em;
  border-left: 1px solid var(--line);
  padding-left: 18px;
}
.app-bar .ws-tag strong { color: var(--accent); font-weight: 500; }


/* KPI cards (stacked, in the left sidebar) */
.kpi-strip {
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.kpi-card {
  border: 1px solid var(--line);
  background: var(--bg-3);
  border-radius: 16px;
  padding: 12px 14px;
  display: flex;
  flex-direction: column;
  gap: 3px;
  text-align: left;
  cursor: pointer;
  font-family: inherit;
  width: 100%;
  -webkit-appearance: none;
  appearance: none;
  transition: border-color 0.12s, background 0.12s;
}
.kpi-card:hover { border-color: var(--accent); background: var(--bg-2); }
.kpi-card .label {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 9.5px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--fg-mute);
}
.kpi-card .value {
  font-size: 17px;
  color: var(--fg);
  letter-spacing: -0.01em;
  font-weight: 500;
}
.kpi-card .sub {
  font-size: 11.5px;
  color: var(--fg-dim);
  line-height: 1.3;
}

/* Profile avatar in the app bar */
.avatar {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  border: 1px solid var(--line-2);
  background: var(--bg-3);
  color: var(--fg);
  font-family: 'IBM Plex Mono', monospace;
  font-size: 11px;
  letter-spacing: 0.04em;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  -webkit-appearance: none;
  appearance: none;
  transition: border-color 0.12s, background 0.12s;
}
.avatar:hover { border-color: var(--accent); background: var(--bg-2); }

.prof-pop {
  position: absolute;
  top: 60px;
  right: 24px;
  width: 320px;
  background: var(--bg-2);
  border: 1px solid var(--line);
  border-radius: 20px;
  overflow: hidden;
  box-shadow: 0 18px 60px rgba(0,0,0,0.5);
  z-index: 70;
  display: none;
  font-family: 'IBM Plex Sans', sans-serif;
}
.prof-pop.open { display: block; }
.prof-head {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 18px 20px;
  border-bottom: 1px solid var(--line);
}
.prof-avatar {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background: var(--accent);
  color: var(--bg);
  font-family: 'IBM Plex Mono', monospace;
  font-size: 13px;
  letter-spacing: 0.04em;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}
.prof-id { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.prof-email {
  font-size: 13px;
  color: var(--fg);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.prof-tier {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 10.5px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--fg-mute);
}
.prof-section { padding: 14px 20px; }
.prof-h {
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 10px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--fg-mute);
  margin-bottom: 10px;
}
.prof-h .prof-count { color: var(--accent); }
.prof-conns {
  list-style: none;
  padding: 0;
  margin: 0 0 12px;
  display: flex;
  flex-direction: column;
  gap: 2px;
  max-height: 200px;
  overflow-y: auto;
}
.prof-conns li {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 0;
  font-size: 13px;
  color: var(--fg);
}
.prof-conns li .d {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--accent);
  box-shadow: 0 0 6px rgba(140,167,138,0.5);
  flex-shrink: 0;
}
.prof-cta {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 11.5px;
  letter-spacing: 0.04em;
  color: var(--accent-ink);
  background: var(--accent);
  border-radius: 999px;
  padding: 8px 16px;
  text-decoration: none;
  transition: background 0.15s;
}
.prof-cta:hover { background: var(--fg); }
.prof-foot {
  padding: 12px 20px;
  border-top: 1px solid var(--line);
}
.prof-foot .logout {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 11.5px;
  letter-spacing: 0.04em;
  color: var(--fg-dim);
  text-decoration: none;
  border: 0;
  padding: 0;
}
.prof-foot .logout:hover { color: var(--fg); }

/* Command pills above the composer */
/* Plus-icon command menu button inside the composer */
.composer .clip {
  flex-shrink: 0;
  width: 30px;
  height: 30px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: transparent;
  border: 0;
  color: var(--fg-mute);
  cursor: pointer;
  -webkit-appearance: none;
  appearance: none;
  border-radius: 8px;
  transition: color 0.12s, background 0.12s;
}
.composer .clip:hover, .composer .clip[aria-expanded="true"] {
  color: var(--fg);
  background: var(--bg-3);
}
.composer .clip svg { display: block; }

.cmd-menu {
  position: absolute;
  bottom: 110px;
  left: 32px;
  background: var(--bg-2);
  border: 1px solid var(--line);
  border-radius: 16px;
  box-shadow: 0 18px 50px rgba(0,0,0,0.10);
  padding: 8px;
  z-index: 65;
  display: none;
  min-width: 220px;
  font-family: 'IBM Plex Sans', sans-serif;
}
.cmd-menu.open { display: block; }
.cmd-menu .cmd {
  display: flex;
  align-items: center;
  gap: 8px;
  width: 100%;
  padding: 9px 12px;
  border-radius: 10px;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 12px;
  letter-spacing: 0.04em;
  color: var(--fg-dim);
  background: transparent;
  border: 0;
  text-align: left;
  cursor: pointer;
  -webkit-appearance: none;
  appearance: none;
  transition: color 0.12s, background 0.12s;
}
.cmd-menu .cmd:hover { color: var(--fg); background: var(--bg-3); }
.cmd-menu .cmd .slash { color: var(--accent); }

/* Layout */
.app-shell {
  flex: 1;
  display: grid;
  grid-template-columns: 280px 1fr;
  min-height: 0;
}

/* Sidebar */
.sidebar {
  border-right: 1px solid var(--line);
  background: var(--bg-2);
  overflow-y: auto;
  padding: 24px 0;
  display: flex;
  flex-direction: column;
  gap: 24px;
}
.sb-section { padding: 0 20px; }
.sb-section .h {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 10px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--fg-mute);
  margin-bottom: 12px;
  display: flex; justify-content: space-between; align-items: center;
}
.sb-section .h .count { color: var(--accent); }

/* Chat */
.chat {
  display: flex;
  flex-direction: column;
  min-height: 0;
  position: relative;
}
.chat-head {
  padding: 16px 28px;
  border-bottom: 1px solid var(--line);
  display: flex; justify-content: space-between; align-items: center;
  flex-shrink: 0;
}
.chat-head h1 {
  font-size: 18px;
  font-weight: 400;
  letter-spacing: -0.01em;
  margin: 0;
}
.chat-head .meta {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 11px;
  color: var(--fg-mute);
  letter-spacing: 0.05em;
}
.chat-head .meta .live { color: var(--accent); }

.chat-body {
  flex: 1;
  overflow-y: auto;
  padding: 32px 28px 24px;
  display: flex; flex-direction: column; gap: 24px;
}
.msg { display: flex; gap: 14px; max-width: 760px; }
.msg.user { align-self: flex-end; max-width: 540px; }
.msg .who {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 10px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--fg-mute);
  margin-bottom: 6px;
}
.msg.user .who { color: var(--accent); }
.msg .bubble {
  font-size: 15px;
  line-height: 1.6;
  color: var(--fg);
}
.msg.user .bubble {
  background: var(--bg-2);
  border: 1px solid var(--line);
  border-radius: 20px;
  padding: 12px 18px;
}
.msg .bubble p { margin: 0 0 10px; }
.msg .bubble p:last-child { margin-bottom: 0; }
.msg .bubble strong { color: var(--accent); font-weight: 500; }

.sources {
  display: flex; flex-wrap: wrap; gap: 6px;
  margin-top: 12px;
}
.src {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 10px;
  letter-spacing: 0.06em;
  color: var(--fg-dim);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 4px 10px;
}
.src::before { content: "● "; color: var(--accent); }

.thinking {
  display: inline-flex;
  gap: 6px;
  align-items: center;
  padding: 4px 2px;
}
.thinking .d {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--accent);
  animation: typing 1.2s infinite ease-in-out;
}
.thinking .d:nth-child(2) { animation-delay: 0.18s; }
.thinking .d:nth-child(3) { animation-delay: 0.36s; }
@keyframes typing {
  0%, 100% { opacity: 0.25; transform: translateY(0); }
  40%      { opacity: 1;    transform: translateY(-3px); }
}

/* Composer */
.composer {
  position: relative;
  border-top: 1px solid var(--line);
  padding: 16px 28px 20px;
  flex-shrink: 0;
  background: var(--bg);
}
.composer-inner {
  border: 1px solid var(--line-2);
  background: var(--bg-2);
  border-radius: 24px;
  padding: 14px 18px 12px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  min-height: 92px;
  transition: border-color 0.18s, box-shadow 0.18s;
}
.composer textarea {
  flex: 1;
  background: transparent;
  border: 0;
  outline: 0;
  resize: none;
  color: var(--fg);
  font-family: 'FH Premier', 'IBM Plex Sans', system-ui, sans-serif;
  font-size: 15px;
  line-height: 1.5;
  min-height: 40px;
  max-height: 200px;
  width: 100%;
}
.composer textarea::placeholder { color: var(--fg-mute); }
.composer-actions {
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.composer-inner:focus-within {
  border-color: rgba(45, 42, 36, 0.28);
  box-shadow: 0 0 0 4px rgba(45, 42, 36, 0.06);
  transition: border-color 0.18s, box-shadow 0.18s;
}
.composer .send {
  width: 34px;
  height: 34px;
  border-radius: 50%;
  padding: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: var(--accent);
  color: var(--accent-ink);
  border: none;
  cursor: pointer;
  -webkit-appearance: none;
  appearance: none;
  flex-shrink: 0;
  transition: transform 0.15s, background 0.15s;
}
.composer .send:hover { transform: scale(1.08); background: var(--fg); }
.composer .send svg { display: block; pointer-events: none; }

/* Empty state (centered greeting + suggestion cards) */
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(12px); }
  to   { opacity: 1; transform: translateY(0); }
}
@keyframes msgIn {
  from { opacity: 0; transform: translateY(6px); }
  to   { opacity: 1; transform: translateY(0); }
}
.msg { animation: msgIn 0.28s cubic-bezier(0.22, 1, 0.36, 1) both; }

.chat-empty {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 0;
  padding: 0 32px 48px;
  text-align: center;
}
.chat-empty.hidden { display: none; }
.empty-logo {
  height: 20px;
  filter: brightness(0);
  opacity: 0;
  margin-bottom: 14px;
  animation: fadeUp 0.5s 0.05s cubic-bezier(0.22, 1, 0.36, 1) forwards;
}
.empty-greeting {
  font-size: 24px;
  font-weight: 300;
  letter-spacing: -0.02em;
  color: var(--fg);
  margin: 0 0 28px;
  opacity: 0;
  animation: fadeUp 0.5s 0.15s cubic-bezier(0.22, 1, 0.36, 1) forwards;
}
.empty-hints {
  display: flex;
  flex-direction: column;
  gap: 8px;
  width: 100%;
  max-width: 500px;
  opacity: 0;
  animation: fadeUp 0.5s 0.25s cubic-bezier(0.22, 1, 0.36, 1) forwards;
}
.empty-hint {
  display: flex;
  align-items: flex-start;
  gap: 14px;
  width: 100%;
  padding: 14px 18px;
  border: 1px solid var(--line);
  border-radius: 14px;
  background: transparent;
  color: var(--fg);
  text-align: left;
  cursor: pointer;
  font-family: inherit;
  -webkit-appearance: none;
  appearance: none;
  transition: background 0.12s, border-color 0.12s, box-shadow 0.12s;
}
.empty-hint:hover {
  background: var(--bg-2);
  border-color: var(--line-2);
  box-shadow: 0 2px 12px rgba(0,0,0,0.04);
}
.empty-hint .eh-icon {
  width: 30px;
  height: 30px;
  border-radius: 8px;
  background: var(--bg-3);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  color: var(--fg-dim);
}
.empty-hint .eh-icon svg { display: block; }
.empty-hint .eh-body { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.empty-hint .eh-title { font-size: 13px; font-weight: 500; color: var(--fg); }
.empty-hint .eh-sub { font-size: 11.5px; color: var(--fg-mute); line-height: 1.4; }

.app-toggle {
  display: none;
  background: transparent;
  border: 1px solid var(--line-2);
  color: var(--fg);
  padding: 7px 10px;
  margin-right: 8px;
  cursor: pointer;
  -webkit-appearance: none;
  appearance: none;
  align-items: center;
  justify-content: center;
}
.app-toggle svg { display: block; }
.app-backdrop {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(31, 30, 27, 0.45);
  backdrop-filter: blur(2px);
  z-index: 40;
}

@media (max-width: 880px) {
  .app-shell { grid-template-columns: 1fr; }
  .chat-body, .composer, .chat-head { padding-left: 18px; padding-right: 18px; }
  .app-bar .ws-tag { display: none; }
  .app-bar .left { gap: 6px; }
  .app-toggle { display: inline-flex; }
  .sidebar {
    position: fixed;
    top: 0; left: 0; bottom: 0;
    width: min(86vw, 320px);
    z-index: 50;
    transform: translateX(-100%);
    transition: transform 0.22s ease;
    border-right: 1px solid var(--line);
    box-shadow: 12px 0 40px rgba(0,0,0,0.45);
  }
  body.drawer-open .sidebar { transform: translateX(0); }
  body.drawer-open .app-backdrop { display: block; }
}
</style>
</head>
<body>

<header class="app-bar">
  <div class="left">
    <button type="button" class="app-toggle" id="app-toggle" aria-controls="sidebar" aria-expanded="false" aria-label="Open sidebar">
      <svg width="18" height="14" viewBox="0 0 18 14" aria-hidden="true"><g stroke="currentColor" stroke-width="1.5" stroke-linecap="square"><line x1="0" y1="2" x2="18" y2="2"/><line x1="0" y1="7" x2="18" y2="7"/><line x1="0" y1="12" x2="18" y2="12"/></g></svg>
    </button>
    <a class="brand" href="#" id="brand-btn" aria-label="Team overview"><img src="images/tend-logo.png" alt="tend" /></a>
    <div class="ws-tag">WORKSPACE · <strong>quiet golf</strong></div>
  </div>
  <div class="right">
    <button type="button" class="avatar" id="avatar-btn" aria-haspopup="true" aria-expanded="false" aria-label="Profile and Tend Ontology">
      <span id="avatar-initials">YT</span>
    </button>
  </div>
</header>

<div class="prof-pop" id="prof-pop" role="dialog" aria-label="Profile and connections">
  <div class="prof-head">
    <div class="prof-avatar" id="prof-avatar-big">YT</div>
    <div class="prof-id">
      <div class="prof-email" id="prof-email">you@company.com</div>
      <div class="prof-tier">Standard plan</div>
    </div>
  </div>

  <div class="prof-section">
    <div class="prof-h">
      <span>Tend Ontology · current connections</span>
      <span class="prof-count">7 live</span>
    </div>
    <ul class="prof-conns">
      <li><span class="d"></span>Shopify</li>
      <li><span class="d"></span>Stripe</li>
      <li><span class="d"></span>QuickBooks</li>
      <li><span class="d"></span>ShipStation</li>
      <li><span class="d"></span>Stocky</li>
      <li><span class="d"></span>Inventory Planner</li>
      <li><span class="d"></span>Loop Returns</li>
    </ul>
    <a class="prof-cta" href="data-brain.html">Open Data Brain →</a>
  </div>

  <div class="prof-foot">
    <a href="#" id="logout" class="logout">Log out</a>
  </div>
</div>


<div class="app-shell">

  <div class="app-backdrop" id="app-backdrop" aria-hidden="true"></div>
  <aside class="sidebar" id="sidebar">
    <div class="sb-section">
      <div class="h"><span>Metrics</span><span class="count">● LIVE</span></div>
      <div class="kpi-strip" id="kpi-strip">
        <button type="button" class="kpi-card" data-cmd="/research how is revenue trending over the last 7 days?">
          <span class="label">Revenue · 7d</span>
          <span class="value">$48.2K</span>
          <span class="sub">+12% vs prior · Shopify + Stripe</span>
        </button>
        <button type="button" class="kpi-card" data-cmd="/research summarize the unread items in my inbox">
          <span class="label">Inbox</span>
          <span class="value">3 unread</span>
          <span class="sub">Acushnet PO · 2 customer replies</span>
        </button>
        <button type="button" class="kpi-card" data-cmd="/research what has the team updated this morning?">
          <span class="label">Team · today</span>
          <span class="value">2 updates</span>
          <span class="sub">Sam · returns Q2 plan · 8m ago</span>
        </button>
      </div>
    </div>

  </aside>


  <main class="chat">
    <div class="chat-head">
      <h1 id="chat-title">New chat</h1>
    </div>

    <div class="chat-body" id="chat-body">
      <div class="chat-empty" id="chat-empty">
        <img src="images/tend-logo.png" class="empty-logo" alt="" />
        <h2 class="empty-greeting" id="empty-greeting">How can I help?</h2>
        <div class="empty-hints" id="hints">
          <button class="empty-hint" type="button" data-text="Morning briefing">
            <span class="eh-icon"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M2 12h2M20 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg></span>

  function reply(text) {
    if (API) return replyLive(text);
    return replyCanned(text);
  }

  function replyCanned(text) {
    var t = addThinking();
    setTimeout(function () {
      t.remove();
      var hit = canned.find(function (c) { return c.match.test(text); });
      addReply(hit.html, hit.sources);
    }, 900);
  }

  // Stream from /api/chat/:user (same Railway server) via SSE.
  function replyLive(text) {
    var userEmail = 'demo@withtend.ai';
    try {
      var sraw = sessionStorage.getItem('tend.session');
      if (sraw) {
        var s = JSON.parse(sraw);
        if (s && s.email) userEmail = s.email;
      }
    } catch (_) {}

    var thinking = addThinking();
    var bubble = null;
    var rawText = '';

    function ensureBubble() {
      if (bubble) return bubble;
      thinking.remove();
      var wrap = document.createElement('div');
      wrap.className = 'msg';
      wrap.innerHTML = '<div><div class="who">tend</div><div class="bubble"></div></div>';
      var b = wrap.querySelector('.bubble');
      body.appendChild(wrap);
      bubble = b;
      return b;
    }

    function fail() {
      thinking.remove();
      replyCanned(text);
    }

    var history = chatHistory.slice(0, -1).slice(-10);
    fetch(API + '/api/chat/' + encodeURIComponent(userEmail), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text, history: history })
    })
    .then(function (r) {
      if (!r.ok || !r.body) throw new Error('http ' + r.status);
      var reader = r.body.getReader();
      var decoder = new TextDecoder();
      var buf = '';
      function pump() {
        return reader.read().then(function (res) {
          if (res.done) {
            if (rawText) chatHistory.push({ role: 'assistant', content: rawText });
            return;
          }
          buf += decoder.decode(res.value, { stream: true });
          var lines = buf.split('\n');
          buf = lines.pop() || '';
          for (var i = 0; i < lines.length; i++) {
            var line = lines[i].trim();
            if (!line || !line.startsWith('data:')) continue;
            var payload = line.slice(5).trim();
            if (payload === '[DONE]') {
              if (rawText) chatHistory.push({ role: 'assistant', content: rawText });
              return;
            }
            try {
              var obj = JSON.parse(payload);
              if (obj.error) throw new Error(obj.error);
              if (obj.delta) {
                ensureBubble();
                rawText += obj.delta;
                bubble.innerHTML = md(rawText);
                scroll();
              }
            } catch (e) {
              throw e;
            }
          }
          return pump();
        });
      }
      return pump();
    })
    .catch(function (e) {
      console.warn('replyLive error:', e);
      fail();
    });
  }

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var text = (input.value || '').trim();
    if (!text) return;
    addUser(text);
    input.value = '';
    input.style.height = 'auto';
    reply(text);
  });

  input.addEventListener('input', function () {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 160) + 'px';
  });

  input.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      form.requestSubmit();
    }
  });

  var hintsEl = document.getElementById('hints');
  if (hintsEl) {
    hintsEl.addEventListener('click', function (e) {
      var b = e.target.closest('.empty-hint');
      if (!b) return;
      input.value = b.getAttribute('data-text') || '';
      input.focus();
      form.requestSubmit();
    });
  }

  // Paperclip command menu: toggle on click. Picking a command points
  // the agent at that task: the agent immediately asks a focused
  // follow-up so the user can fill in the specifics.
  var CMD_PROMPTS = {
    '/build':           { ask: "Great. What do you want to build? A workflow, a one-off automation, a doc?", placeholder: "e.g. a daily POs-needing-approval digest emailed to me by 7am" },
    '/research':        { ask: "On it. What do you want to research?", placeholder: "e.g. why returns spiked on Performance Polo Stone last week" },
    '/market-research': { ask: "Sure. What market, competitor, or trend do you want me to dig into?", placeholder: "e.g. how Linksoul's pricing and bundle structure compares to ours" },
    '/inventory':       { ask: "Pulling inventory. Any SKU or category in particular, or do you want the full state?", placeholder: "e.g. all gloves and what's running low for the next 14 days" },
    '/finance':         { ask: "Opening finance. Want runway, AP/AR, payouts, or the month-end view?", placeholder: "e.g. draft the May P&L and flag anything unusual" },
    '/team':            { ask: "Tapping into team updates. Anyone specific, or do you want the whole team summary?", placeholder: "e.g. what has Sam shipped this week" }
  };
  var clipBtn = document.getElementById('clip-btn');
  var cmdMenu = document.getElementById('cmd-menu');
  function closeCmdMenu() {
    if (!cmdMenu) return;
    cmdMenu.classList.remove('open');
    if (clipBtn) clipBtn.setAttribute('aria-expanded', 'false');
  }
  if (clipBtn && cmdMenu) {
    clipBtn.addEventListener('click', function (e) {
      e.stopPropagation();
      var open = cmdMenu.classList.toggle('open');
      clipBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
    });
    cmdMenu.addEventListener('click', function (e) {
      var c = e.target.closest('.cmd');
      if (!c) return;
      var cmdKey = (c.getAttribute('data-cmd') || '').trim();
      var entry = CMD_PROMPTS[cmdKey];
      closeCmdMenu();
      if (!entry) return;
      addUser(cmdKey);
      var t = addThinking();
      setTimeout(function () {
        t.remove();
        addReply('<p>' + entry.ask + '</p>', [cmdKey.slice(1) + ' mode']);
        if (entry.placeholder) input.setAttribute('placeholder', entry.placeholder);
        input.focus();
      }, 850);
    });
    document.addEventListener('click', function (e) {
      if (!cmdMenu.classList.contains('open')) return;
      if (cmdMenu.contains(e.target) || clipBtn.contains(e.target)) return;
      closeCmdMenu();
    });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && cmdMenu.classList.contains('open')) closeCmdMenu();
    });
  }

  // Brand logo: clicking tend shows a team activity overview in the chat.
  var brandBtn = document.getElementById('brand-btn');
  if (brandBtn) {
    brandBtn.addEventListener('click', function (e) {
      e.preventDefault();
      var q = 'What is the team up to today?';
      addUser(q);
      reply(q);
    });
  }

  // KPI cards (Revenue / Inbox / Team): pre-fill the composer with a
  // /research query about that surface and submit.
  var kpiStrip = document.getElementById('kpi-strip');
  if (kpiStrip) {
    kpiStrip.addEventListener('click', function (e) {
      var card = e.target.closest('.kpi-card');
      if (!card) return;
      var q = card.getAttribute('data-cmd');
      if (!q) return;
      input.value = q;
      form.requestSubmit();
    });
  }

  setTimeout(function () { input.focus(); }, 100);
})();
</script>

</body>
</html>
