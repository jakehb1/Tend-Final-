<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<title>tend Workspace</title>
<script>
  (function () {
    document.documentElement.style.visibility = 'hidden';
    fetch('/api/auth/me', { credentials: 'same-origin' })
      .then(function (r) {
        if (!r.ok) return window.location.replace('login.html');
        return r.json().then(function (data) {
          window.__TEND_USER__ = data.user;
          document.documentElement.style.visibility = '';
        });
      })
      .catch(function () { window.location.replace('login.html'); });
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="shared.css?v=5">
<style>
/* ----- Light theme override for /app (Claude-style warm light) ----- */
:root {
  --bg:    #FAF9F5;
  --bg-2:  #F4F1EA;
  --bg-3:  #EBE7DC;
  --fg:    #1F1E1B;
  --fg-dim: rgba(31, 30, 27, 0.66);
  --fg-mute: rgba(31, 30, 27, 0.42);
  --line:   rgba(31, 30, 27, 0.08);
  --line-2: rgba(31, 30, 27, 0.18);
  --accent: #E5E9E0;
  --accent-ink: #1F1E1B;
  --accent-soft: rgba(229, 233, 224, 0.45);
}
html {
  background: var(--bg);
  overflow-x: hidden;
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
}

html, body { height: 100dvh; max-width: 100vw; }
@supports not (height: 100dvh) { html, body { height: 100vh; } }
body {
  background: var(--bg);
  color: var(--fg);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  width: 100%;
  overscroll-behavior: none;
}
button, a, .b-item, .icon-btn, .pill-btn { touch-action: manipulation; }

/* App top bar */
.app-bar {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  padding: 12px 18px;
  background: var(--bg);
  flex-shrink: 0;
  position: relative;
  z-index: 30;
}
.bar-slot { display: flex; align-items: center; }
.bar-left { justify-self: start; }
.bar-center { justify-self: center; }
.bar-right { justify-self: end; }

.icon-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 38px;
  height: 38px;
  border-radius: 50%;
  background: var(--bg-3);
  border: 0;
  color: var(--fg);
  cursor: pointer;
  text-decoration: none;
  -webkit-appearance: none;
  appearance: none;
  transition: background 0.12s;
}
.icon-btn:hover { background: var(--line-2); }
.icon-btn img { width: 14px; height: auto; display: block; filter: brightness(0); }
.icon-btn svg { display: block; }
.icon-btn .brand-mark {
  display: block;
  width: 26px;
  height: 18px;
  background: url('images/tend-logo.png') no-repeat left center / auto 100%;
  filter: brightness(0);
}
#brand-btn {
  background: transparent;
  width: auto;
  height: auto;
  padding: 0;
}
#brand-btn:hover { background: transparent; }

.tend-chip {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 12px;
  letter-spacing: 0.16em;
  color: var(--fg);
  background: var(--bg-3);
  border-radius: 999px;
  padding: 9px 24px;
}


/* KPI cards (stacked, in the left sidebar) */
.kpi-strip {
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.kpi-card {
  border: 1px solid var(--line);
  background: var(--bg-3);
  border-radius: 16px;
  padding: 12px 14px;
  display: flex;
  flex-direction: column;
  gap: 3px;
  text-align: left;
  cursor: pointer;
  font-family: inherit;
  width: 100%;
  -webkit-appearance: none;
  appearance: none;
  transition: border-color 0.12s, background 0.12s;
}
.kpi-card:hover { border-color: var(--accent); background: var(--bg-2); }
.kpi-card .label {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 9.5px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--fg-mute);
}
.kpi-card .value {
  font-size: 17px;
  color: var(--fg);
  letter-spacing: -0.01em;
  font-weight: 500;
}
.kpi-card .sub {
  font-size: 11.5px;
  color: var(--fg-dim);
  line-height: 1.3;
}


/* Command pills above the composer */
.composer .clip[aria-expanded="true"] { background: var(--line-2); }

.cmd-menu {
  position: absolute;
  bottom: 70px;
  left: 24px;
  background: var(--bg-2);
  border: 1px solid var(--line);
  border-radius: 16px;
  box-shadow: 0 18px 50px rgba(0,0,0,0.10);
  padding: 8px;
  z-index: 65;
  display: none;
  min-width: 220px;
  font-family: 'IBM Plex Sans', sans-serif;
}
.cmd-menu.open { display: block; }
.cmd-menu .cmd {
  display: flex;
  align-items: center;
  gap: 8px;
  width: 100%;
  padding: 9px 12px;
  border-radius: 10px;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 12px;
  letter-spacing: 0.04em;
  color: var(--fg-dim);
  background: transparent;
  border: 0;
  text-align: left;
  cursor: pointer;
  -webkit-appearance: none;
  appearance: none;
  transition: color 0.12s, background 0.12s;
}
.cmd-menu .cmd:hover { color: var(--fg); background: var(--bg-3); }
.cmd-menu .cmd .slash { color: var(--fg); }

/* Recent conversations list */
.sb-recent .h { margin-bottom: 8px; }
.sb-new-chat {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 10px;
  letter-spacing: 0.06em;
  color: var(--fg-mute);
  background: transparent;
  border: 0;
  padding: 0;
  cursor: pointer;
  text-transform: uppercase;
  -webkit-appearance: none;
  appearance: none;
}
.sb-new-chat:hover { color: var(--fg); }
.conv-list { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 1px; }
.conv-list .conv-empty {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 10.5px;
  letter-spacing: 0.04em;
  color: var(--fg-mute);
  padding: 6px 0;
}
.conv-item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 7px 10px;
  margin: 0 -10px;
  border-radius: 8px;
  font-size: 12.5px;
  color: var(--fg-dim);
  cursor: pointer;
  background: transparent;
  border: 0;
  width: calc(100% + 20px);
  text-align: left;
  font-family: inherit;
  -webkit-appearance: none;
  appearance: none;
  transition: background 0.12s, color 0.12s;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.conv-item:hover { background: var(--bg-3); color: var(--fg); }
.conv-item.active { background: var(--bg-3); color: var(--fg); font-weight: 500; }
.conv-item .conv-del {
  margin-left: auto;
  opacity: 0;
  background: transparent;
  border: 0;
  color: var(--fg-mute);
  cursor: pointer;
  padding: 0 2px;
  font-size: 14px;
  line-height: 1;
  -webkit-appearance: none;
  appearance: none;
  transition: opacity 0.12s, color 0.12s;
}
.conv-item:hover .conv-del { opacity: 1; }
.conv-item .conv-del:hover { color: var(--fg); }

/* Sidebar footer */
.sb-foot {
  margin-top: auto;
  padding: 0 16px 8px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.sb-logout {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 11px;
  letter-spacing: 0.04em;
  color: var(--fg-mute);
  text-decoration: none;
  transition: color 0.12s;
}
.sb-logout:hover { color: var(--fg); }
.sb-gear {
  width: 32px;
  height: 32px;
  border-radius: 8px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  color: var(--fg-mute);
  text-decoration: none;
  transition: color 0.12s, background 0.12s;
}
.sb-gear:hover { color: var(--fg); background: var(--bg-3); }
.sb-gear svg { display: block; }

/* Layout */
.app-shell {
  flex: 1;
  display: flex;
  min-height: 0;
  min-width: 0;
  width: 100%;
  position: relative;
  overflow: hidden;
}

/* Sidebar (always a drawer, opens from logo button) */
.sidebar {
  position: fixed;
  top: 0; left: 0; bottom: 0;
  width: min(86vw, 320px);
  z-index: 50;
  transform: translateX(-100%);
  transition: transform 0.22s ease;
  border-right: 1px solid var(--line);
  background: var(--bg-2);
  overflow-y: auto;
  padding: 24px 0;
  box-shadow: 12px 0 40px rgba(0,0,0,0.08);
  display: flex;
  flex-direction: column;
  gap: 24px;
}
.sb-section { padding: 0 20px; }
.sb-section .h {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 10px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--fg-mute);
  margin-bottom: 12px;
  display: flex; justify-content: space-between; align-items: center;
}
.sb-section .h .count { color: var(--fg); }

/* Chat */
.chat {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-height: 0;
  min-width: 0;
  position: relative;
}
/* Column wrappers: transparent on mobile (display:contents), structural on desktop */
.chat-col-left, .chat-col-right { display: contents; }
/* Mobile flex order: greeting → messages → bento → composer (composer pinned to bottom) */
.chat-empty { order: 1; }
.chat-body  { order: 2; }
.home-bento { order: 3; }
.composer   { order: 4; }
.chat-head { display: none; }
.chat-head h1 {
  font-size: 18px;
  font-weight: 400;
  letter-spacing: -0.01em;
  margin: 0;
  min-width: 0;
  flex: 1;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.chat-head .meta {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 11px;
  color: var(--fg-mute);
  letter-spacing: 0.05em;
}
.chat-head .meta .live { color: var(--fg); }

.chat-body {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 32px 28px 24px;
  display: flex; flex-direction: column; gap: 24px; justify-content: flex-end;
  min-width: 0;
}
.msg { display: flex; gap: 14px; max-width: min(760px, 100%); min-width: 0; }
.msg.user { align-self: flex-end; max-width: min(540px, 100%); }
.msg > div { min-width: 0; flex: 1; }
.msg .who {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 10px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--fg-mute);
  margin-bottom: 6px;
}
.msg.user .who { color: var(--fg); }
.msg .bubble {
  font-size: 15px;
  line-height: 1.6;
  color: var(--fg);
  overflow-wrap: anywhere;
  word-break: break-word;
  min-width: 0;
  max-width: 100%;
}
.msg .bubble * { max-width: 100%; }
.msg .bubble img, .msg .bubble svg { height: auto; }
.msg .bubble pre,
.msg .bubble table { overflow-x: auto; display: block; }
.msg .bubble code { white-space: pre-wrap; word-break: break-word; }
.msg.user .bubble {
  background: var(--bg-2);
  border: 1px solid var(--line);
  border-radius: 20px;
  padding: 12px 18px;
}
.msg .bubble p { margin: 0 0 10px; }
.msg .bubble p:last-child { margin-bottom: 0; }
.msg .bubble strong { color: var(--fg); font-weight: 600; }

.sources {
  display: flex; flex-wrap: wrap; gap: 6px;
  margin-top: 12px;
}
.src {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 10px;
  letter-spacing: 0.06em;
  color: var(--fg-dim);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 4px 10px;
}
.src::before { content: "● "; color: var(--fg); }

.thinking {
  display: inline-flex;
  gap: 6px;
  align-items: center;
  padding: 4px 2px;
}
.thinking .d {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--fg-dim);
  animation: typing 1.2s infinite ease-in-out;
}
.thinking .d:nth-child(2) { animation-delay: 0.18s; }
.thinking .d:nth-child(3) { animation-delay: 0.36s; }
@keyframes typing {
  0%, 100% { opacity: 0.25; transform: translateY(0); }
  40%      { opacity: 1;    transform: translateY(-3px); }
}

.attach-chips {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  max-width: min(760px, 100%);
  margin: 0 auto 8px;
}
.attach-chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 5px 10px 5px 8px;
  background: var(--bg-2);
  border: 1px solid var(--line);
  border-radius: 999px;
  font-size: 12px;
  color: var(--fg);
  max-width: 100%;
}
.attach-name {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  max-width: 200px;
}
.attach-remove {
  background: transparent;
  border: 0;
  color: var(--fg-dim);
  font-size: 16px;
  line-height: 1;
  padding: 0 2px;
  cursor: pointer;
}
.attach-remove:hover { color: var(--fg); }

/* Composer (horizontal: [+] [input pill] [paperclip] [mic]) */
.composer {
  position: relative;
  border-top: 1px solid var(--line);
  padding: 14px 18px 18px;
  flex-shrink: 0;
  background: var(--bg);
  min-width: 0;
  max-width: 100%;
}
.composer-inner {
  display: flex;
  align-items: center;
  gap: 10px;
  max-width: min(760px, 100%);
  margin: 0 auto;
  background: transparent;
  border: 0;
  padding: 0;
  min-height: 0;
  min-width: 0;
}
.composer textarea { min-width: 0; }
.pill-btn { flex-shrink: 0; }
.composer textarea {
  flex: 1;
  background: var(--bg-2);
  border: 1px solid var(--line-2);
  border-radius: 999px;
  outline: 0;
  resize: none;
  color: var(--fg);
  font-family: 'FH Premier', 'IBM Plex Sans', system-ui, sans-serif;
  font-size: 16px;
  line-height: 1.4;
  min-height: 40px;
  max-height: 140px;
  padding: 10px 18px;
  width: 100%;
  transition: border-color 0.18s, box-shadow 0.18s;
}
.composer textarea:focus {
  border-color: rgba(45, 42, 36, 0.3);
  box-shadow: 0 0 0 4px rgba(45, 42, 36, 0.06);
}
.composer textarea::placeholder { color: var(--fg-mute); }
.composer .pill-btn {
  flex-shrink: 0;
  width: 40px;
  height: 40px;
  border-radius: 50%;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: var(--bg-3);
  border: 0;
  color: var(--fg);
  cursor: pointer;
  -webkit-appearance: none;
  appearance: none;
  transition: background 0.15s, color 0.15s;
}
.composer .pill-btn:hover { background: var(--line-2); }
.composer .pill-btn svg { display: block; pointer-events: none; }
/* Send button: idle = light/dim, is-active = inked (text present) */
.composer .send {
  background: var(--bg-3);
  color: var(--fg-mute);
  transition: background 0.15s, color 0.15s, transform 0.12s;
}
.composer .send.is-active {
  background: var(--fg);
  color: var(--bg);
}
.composer .send.is-active:hover { background: #000; }
.composer .send:disabled { opacity: 0.5; cursor: default; }

/* Empty state (centered greeting + suggestion cards) */
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(12px); }
  to   { opacity: 1; transform: translateY(0); }
}
@keyframes msgIn {
  from { opacity: 0; transform: translateY(6px); }
  to   { opacity: 1; transform: translateY(0); }
}
.msg { animation: msgIn 0.28s cubic-bezier(0.22, 1, 0.36, 1) both; }

.chat-empty {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: flex-start;
  padding: 8px 24px 0;
  max-width: 760px;
  margin: 0 auto;
  width: 100%;
  box-sizing: border-box;
}
.chat-empty.hidden { display: none; }
.empty-greeting {
  font-size: 30px;
  font-weight: 500;
  letter-spacing: -0.01em;
  color: var(--fg);
  line-height: 1.2;
  margin: 0;
  opacity: 0;
  animation: fadeUp 0.5s 0.1s cubic-bezier(0.22, 1, 0.36, 1) forwards;
}

.home-bento {
  border-top: 1px solid var(--line);
  padding: 16px 18px 22px;
  background: var(--bg);
  flex-shrink: 0;
  max-width: 760px;
  margin: 0 auto;
  width: 100%;
  box-sizing: border-box;
}
.home-bento.hidden { display: none; }
.bento {
  display: grid;
  grid-template-columns: repeat(12, minmax(0, 1fr));
  gap: 10px;
  width: 100%;
  min-width: 0;
  opacity: 0;
  animation: fadeUp 0.5s 0.2s cubic-bezier(0.22, 1, 0.36, 1) forwards;
}
.b-item {
  background: var(--bg-2);
  border: 0;
  color: var(--fg);
  font-family: inherit;
  font-size: 15px;
  font-weight: 500;
  border-radius: 999px;
  padding: 18px 22px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  line-height: 1.2;
  min-width: 0;
  overflow: hidden;
  -webkit-appearance: none;
  appearance: none;
  transition: background 0.12s, transform 0.12s;
}
.b-item { background: var(--accent); }
.b-item:hover { background: #DBDFD4; }
.b-item.b-circle {
  border-radius: 50%;
  aspect-ratio: 1;
  padding: 8px;
  font-size: 13.5px;
}
.b-rev    { grid-column: 1 / 7;  padding: 16px; }
.b-inb    { grid-column: 7 / 13; padding: 16px; }
.b-dec    { grid-column: 1 / 8;  min-height: 120px; padding: 18px; border-radius: 28px; }
.b-team   { grid-column: 8 / 13; aspect-ratio: 1; }
.b-daily  { grid-column: 1 / 5;  aspect-ratio: 1; }
.b-alerts { grid-column: 5 / 9;  align-self: center; padding: 16px; }
.b-start  {
  grid-column: 9 / 13;
  aspect-ratio: 1;
  background: var(--fg);
  color: var(--bg);
  font-size: 13.5px;
  line-height: 1.2;
}
.b-start:hover { background: #000; }

@media (max-width: 720px) {
  .empty-greeting { font-size: 26px; }
  .b-item { font-size: 14px; padding: 14px 16px; }
  .b-item.b-circle { font-size: 13px; }
  .b-dec { padding: 18px; min-height: 110px; }
  .home-bento { padding: 14px 14px 18px; }
}
@media (max-width: 480px) {
  .empty-greeting { font-size: 22px; }
  .b-item { font-size: 13px; padding: 12px 14px; }
  .b-item.b-circle { font-size: 12px; }
}

.app-toggle {
  display: none;
  background: transparent;
  border: 1px solid var(--line-2);
  color: var(--fg);
  padding: 7px 10px;
  margin-right: 8px;
  cursor: pointer;
  -webkit-appearance: none;
  appearance: none;
  align-items: center;
  justify-content: center;
}
.app-toggle svg { display: block; }
.app-backdrop {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(31, 30, 27, 0.45);
  backdrop-filter: blur(2px);
  z-index: 40;
}

body.drawer-open .sidebar { transform: translateX(0); }
body.drawer-open .app-backdrop { display: block; }

@media (max-width: 720px) {
  .chat-body { padding: 24px 18px 20px; }
  .chat-head { padding-left: 16px; padding-right: 16px; }
  .composer { padding: 8px 6px 10px; }
  .tend-chip { font-size: 11px; padding: 7px 18px; }
  .icon-btn { width: 34px; height: 34px; }
  .app-bar { padding: 10px 14px; }
  .msg.user { max-width: min(420px, 100%); }
  .msg.user .bubble { padding: 10px 14px; font-size: 14.5px; }

  /* Claude Code mobile composer: one rounded card, textarea on top, actions below */
  .composer-inner {
    display: grid;
    grid-template-columns: auto 1fr auto auto auto;
    grid-template-areas:
      "ta   ta ta     ta  ta"
      "clip .  attach mic send";
    column-gap: 8px;
    row-gap: 6px;
    align-items: center;
    background: var(--bg-2);
    border: 1px solid var(--line-2);
    border-radius: 26px;
    padding: 10px 10px 10px;
    transition: border-color 0.18s, box-shadow 0.18s;
  }
  .composer-inner:focus-within {
    border-color: rgba(45, 42, 36, 0.25);
    box-shadow: 0 0 0 4px rgba(45, 42, 36, 0.05);
  }
  #clip-btn   { grid-area: clip; }
  #msg-input  { grid-area: ta; }
  #attach-btn { grid-area: attach; }
  #mic-btn    { grid-area: mic; }
  #send-btn   { grid-area: send; }
  .composer-inner textarea {
    background: transparent;
    border: 0;
    border-radius: 0;
    padding: 8px 10px 2px;
    min-height: 44px;
    max-height: 160px;
    font-size: 17px;
    width: 100%;
  }
  .composer-inner textarea:focus { border-color: transparent; box-shadow: none; }
  .composer .pill-btn { width: 38px; height: 38px; }
}
@media (max-width: 480px) {
  .chat-body { padding: 18px 14px 16px; gap: 18px; }
  .msg { gap: 10px; }
}

/* ---------- Desktop two-column layout (>=1024px) ---------- */
@media (min-width: 1024px) {
  .app-bar   { display: none; }
  .chat-head { display: none; }
  .b-start   { display: none; }

  /* Two independent flex columns — left/right height never coupled */
  .chat { display: flex; flex-direction: row; padding: 0; box-sizing: border-box; }

  .chat-col-left, .chat-col-right { display: flex; flex-direction: column; }

  .chat-col-left {
    width: 38%;
    min-width: 340px;
    max-width: 500px;
    flex-shrink: 0;
    padding: 72px 28px 22px;
    border-right: 1px solid var(--line);
  }
  .chat-col-right { flex: 1; min-width: 0; min-height: 0; }

  /* Left column contents */
  .chat-empty { flex: 1; max-width: none; padding: 0; justify-content: flex-start; order: 0; }
  .chat-empty.hidden { display: flex !important; }
  .empty-greeting { font-size: 28px; line-height: 1.2; margin-bottom: 24px; }
  .home-bento { flex-shrink: 0; border-top: 0; padding: 0 0 22px; max-width: none; order: 0; }
  .home-bento.hidden { display: block !important; }

  /* Right column contents */
  .chat-body { flex: 1; min-height: 0; padding: 24px 28px; justify-content: flex-end; order: 0; }
  .composer  { flex-shrink: 0; border-top: 1px solid var(--line); padding: 16px 28px 22px; order: 0; }

  /* Desktop bento */
  .bento { gap: 12px; max-width: none; }
  .b-item { font-size: 14px; padding: 14px 18px; }
  .b-item.b-circle { font-size: 12.5px; }
  .b-dec { min-height: 140px; }

  /* Floating gear — no circle */
  .desktop-gear {
    position: fixed; top: 22px; right: 22px;
    z-index: 35; display: inline-flex;
    background: transparent; border: none;
  }
  .desktop-gear:hover { background: var(--line-2); }
  /* Floating brand mark — sage green */
  .desktop-brand {
    position: fixed; top: 22px; left: 22px;
    z-index: 35; display: inline-flex;
    background: #E5E9E0;
  }
  .desktop-brand:hover { background: #DBDFD4; }
}
@media (max-width: 1023px) {
  .desktop-gear, .desktop-brand { display: none; }
}

/* ---------- KPI / context card (rendered when bento clicked) ---------- */
.kpi-bubble {
  background: var(--accent);
  border-radius: 26px;
  padding: 8px 22px 18px;
  width: 100%;
  max-width: 100%;
  box-sizing: border-box;
  align-self: stretch;
  display: flex;
  flex-direction: column;
}
.kpi-row {
  display: grid;
  grid-template-columns: minmax(0, auto) 1fr;
  gap: 18px;
  padding: 16px 0;
  border-bottom: 0;
  align-items: center;
}
.kpi-row.tall { align-items: flex-start; padding: 18px 0; }
.kpi-tag {
  background: rgba(31, 30, 27, 0.06);
  border-radius: 18px;
  padding: 10px 18px;
  font-size: 20px;
  font-weight: 500;
  letter-spacing: -0.01em;
  white-space: nowrap;
  color: var(--fg);
}
.kpi-desc {
  font-size: 14.5px;
  color: var(--fg);
  text-align: right;
  line-height: 1.45;
}
.kpi-foot {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding-top: 14px;
  font-size: 12px;
  color: var(--fg-dim);
}
.kpi-mark {
  display: inline-block;
  width: 18px;
  height: 12px;
  background: url('images/tend-logo.png') no-repeat left center / auto 100%;
  filter: brightness(0);
  opacity: 0.45;
}
@media (max-width: 480px) {

  .kpi-desc { text-align: left; }
  .kpi-tag { font-size: 18px; padding: 8px 14px; align-self: flex-start; }
  .kpi-bubble { padding: 6px 16px 14px; border-radius: 22px; }
}
</style>

<script>

<script>
(function () {
  var CFG = window.__TEND_CONFIG__ || {};
  var API = CFG.apiBase || '';
  var ME = window.__TEND_USER__ || null;
  if (ME && ME.email) {
    var firstName = (ME.email.split('@')[0] || '').split(/[.\-_]/)[0];
    firstName = firstName.charAt(0).toUpperCase() + firstName.slice(1);
    var greetEl = document.getElementById('empty-greeting');
    if (greetEl && firstName) greetEl.innerHTML = 'Welcome ' + firstName + ',<br/>How can I help you?';
  }

  var logoutBtn = document.getElementById('logout');
  if (logoutBtn) {
    logoutBtn.addEventListener('click', function (e) {
      e.preventDefault();
      fetch('/api/auth/logout', { method: 'POST', credentials: 'same-origin' })
        .finally(function () { window.location.href = 'login.html'; });
    });
  }

  var backdrop = document.getElementById('app-backdrop');
  var brandBtn = document.getElementById('brand-btn');
  var brandBtnDesktop = document.getElementById('brand-btn-desktop');
  function setDrawer(open) {
    document.body.classList.toggle('drawer-open', open);
    if (brandBtn) brandBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
    if (brandBtnDesktop) brandBtnDesktop.setAttribute('aria-expanded', open ? 'true' : 'false');
  }
  function toggleDrawer(e) {
    if (e) e.preventDefault();
    setDrawer(!document.body.classList.contains('drawer-open'));
  }
  if (brandBtn) brandBtn.addEventListener('click', toggleDrawer);
  if (brandBtnDesktop) brandBtnDesktop.addEventListener('click', toggleDrawer);
  if (backdrop) {
    backdrop.addEventListener('click', function () { setDrawer(false); });
  }
  document.querySelectorAll('#sidebar .kpi-card, #sidebar .conv-item').forEach(function (n) {
    n.addEventListener('click', function () { setDrawer(false); });
  });

  var body = document.getElementById('chat-body');
  var form = document.getElementById('composer');
  var input = document.getElementById('msg-input');
  var chatHistory = [];
  var activeConvId = null;

  function scroll() { body.scrollTop = body.scrollHeight; }

  function el(tag, className, html) {
    var n = document.createElement(tag);
    if (className) n.className = className;
    if (html != null) n.innerHTML = html;
    return n;
  }

  function md(t) {
    return t
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
      .replace(/\n\n+/g, '</p><p>')
      .replace(/\n/g, '<br>')
      .replace(/^/, '<p>').replace(/$/, '</p>');
  }

  var chatEmpty = document.getElementById('chat-empty');
  var homeBento = document.getElementById('home-bento');
  function hideEmpty() {
    if (chatEmpty && !chatEmpty.classList.contains('hidden')) chatEmpty.classList.add('hidden');
    if (homeBento && !homeBento.classList.contains('hidden')) homeBento.classList.add('hidden');
  }
  function showEmpty() {
    if (chatEmpty) chatEmpty.classList.remove('hidden');
    if (homeBento) homeBento.classList.remove('hidden');
  }

  function addUser(text) {
    hideEmpty();
    var wrap = el('div', 'msg user');
    wrap.innerHTML = '<div><div class="who">you</div><div class="bubble"></div></div>';
    wrap.querySelector('.bubble').textContent = text;
    body.appendChild(wrap);
    scroll();
    chatHistory.push({ role: 'user', content: text });
  }

  function addThinking() {
    var wrap = el('div', 'msg');
    wrap.innerHTML = '<div><div class="who">tend</div><div class="bubble"><span class="thinking" aria-label="tend is typing"><span class="d"></span><span class="d"></span><span class="d"></span></span></div></div>';
    body.appendChild(wrap);
    scroll();
    return wrap;
  }

  function addReply(html, sources) {
    var wrap = el('div', 'msg');
    var srcHTML = (sources || []).map(function (s) { return '<div class="src">' + s + '</div>'; }).join('');
    wrap.innerHTML = '<div><div class="who">tend</div><div class="bubble">' + html + (srcHTML ? '<div class="sources">' + srcHTML + '</div>' : '') + '</div></div>';
    body.appendChild(wrap);
    scroll();
    var tmp = document.createElement('div');
    tmp.innerHTML = html;
    chatHistory.push({ role: 'assistant', content: tmp.textContent.trim() });
  }

  var canned = [
    {
      match: /morning|brief|today|standup|what.*happen|what.*change/i,
      html: "<p>Good morning. Here's what happened since you logged off at 7:14 PM yesterday:</p><p><strong>Orders.</strong> <strong>47 orders</strong> overnight for <strong>$4,820</strong> (AOV $103). Biggest: a bundle of two Performance Polos + a Heritage Hat ($248) from a returning customer in Austin. Repeat-rate on overnight orders: 38%.</p><p><strong>Inventory.</strong> 3 SKUs hit low-stock: Players Glove (M) at 8 units, Heritage Hat (Olive) at 12, Performance Polo (Sage XL) at 6. Stocky drafted POs for all three; Acushnet glove PO needs your approval today.</p><p><strong>Fulfillment.</strong> 38 shipments out the door by 6:30 AM. One USPS delay flagged on a Cart Bag to Toronto (4 days in transit, normally 2). Proactive update drafted to the customer.</p><p><strong>Cash.</strong> Stripe payout of <strong>$18,420</strong> hits the operating account Wednesday. No disputes opened overnight. One declined-card retry succeeded on second attempt; order now processing.</p><p><strong>Service.</strong> One return request flagged: customer wants to swap a Performance Polo (Stone) for Cream. Draft reply + prepaid label ready.</p>",
      sources: ['Shopify · overnight orders', 'Stocky · inventory', 'ShipStation · shipments', 'Stripe · payouts', 'Loop Returns · 1 return']
    },
    {
      match: /best.?sell|what.?s.?selling|top.?sku|hot.?sell|move/i,
      html: "<p>Top sellers by revenue, last 7 days:</p><p>1. <strong>Performance Polo · Sage</strong>. 84 units, $7,560 (+18% vs prior week)<br/>2. <strong>Heritage Hat · Navy</strong>. 62 units, $2,170 (steady)<br/>3. <strong>Tour Towel</strong>. 51 units, $1,275<br/>4. <strong>Players Glove · M</strong>. 47 units, $1,175 (low stock, 8 left)<br/>5. <strong>Cart Bag · Stone</strong>. 9 units, $2,160 (high AOV, slow sell-through)</p><p>Sage XL is going to run out before end-of-week at current pace. Stocky's draft PO is ready when you are.</p>",
      sources: ['Shopify · last 7 days', 'Stocky · inventory']
    },
    {
      match: /low.?stock|inventory|running low|run out|stock alert/i,
      html: "<p>Three SKUs flagged for low stock at current sell-through rate:</p><p>· <strong>Players Glove (M)</strong>. 8 units left, sells ~7/day → ~1 day of cover. PO drafted to Acushnet for 144 units, awaiting your approval.<br/>· <strong>Heritage Hat (Olive)</strong>. 12 units, sells 2/day → 6 days of cover. Lead time 21 days, so reorder now or risk a 2-week stockout.<br/>· <strong>Performance Polo (Sage XL)</strong>. 6 units, sells 4/day → 1.5 days. Production lead time 35 days. Consider pushing a backorder option on the PDP, or holding the size off the next ad rotation.</p><p>I can approve all three POs at once if you want, or walk them one at a time.</p>",
      sources: ['Shopify · inventory', 'Stocky · sell-through', 'Inventory Planner · forecast', 'Vendor lead times']
    },
    {
      match: /ship|fulfill|usps|delay|shipping|in transit/i,
      html: "<p>Shipping state this week:</p><p>· <strong>1,840 shipments</strong> out the door (May MTD)<br/>· Median order-to-label: <strong>6.4 hours</strong> (within your SLA)<br/>· Median order-to-delivered (US): <strong>3.1 days</strong><br/>· <strong>2 delays</strong> flagged:</p><p>· Toronto Cart Bag order #QG-18387, 4 days in transit (normally 2). USPS scan shows it's at the border. Proactive update drafted to the customer.<br/>· Chicago Heritage Hat order #QG-18401, label printed Friday but never scanned by the carrier. Investigating with ShipStation support.</p><p>Want me to send the Toronto update now and reissue the Chicago label?</p>",
      sources: ['ShipStation · 1,840 shipments', 'USPS · tracking', 'Loop Returns · zero correlated']
    },
    {
      match: /payout|stripe.*payout|cash.*payout|next pay|wednesday|when.*paid/i,
      html: "<p>Next Stripe payout: <strong>$18,420</strong>, scheduled for <strong>Wednesday</strong> (bank transfer, 1-2 business day arrival to your operating account).</p><p>Breakdown:</p><p>· $19,640 in gross sales<br/>· $580 in Stripe fees (2.9% + 30¢ avg, blended 2.95%)<br/>· $640 in refunds (Mon–Tue)</p><p>No disputes opened this week. Two prior payouts averaging $17K/wk; this one is slightly above trend, mostly from the weekend Sage Polo run.</p>",
      sources: ['Stripe · upcoming payout', 'Stripe · payout history']
    },

  function reply(text) {
    if (API) return replyLive(text);
    return replyCanned(text);
  }

  function replyCanned(text) {
    var t = addThinking();

      t.remove();

      addReply(hit.html, hit.sources);
    }, 900);

  // Ensures we have an active conversation id, creating one if needed.
  function ensureConversation() {
    if (activeConvId) return Promise.resolve(activeConvId);
    return fetch('/api/conversations', { method: 'POST', credentials: 'same-origin' })
      .then(function (r) {
        if (!r.ok) throw new Error('conversation create failed');
        return r.json();
      })
      .then(function (data) {
        activeConvId = data.conversation.id;
        return activeConvId;
      });
  }

  // Stream a real Claude response via POST /api/chat/:convId
  function replyLive(text) {
    var thinking = addThinking();
    var bubble = null;
    var rawText = '';

    function ensureBubble() {
      if (bubble) return bubble;
      thinking.remove();
      var wrap = document.createElement('div');
      wrap.className = 'msg';
      wrap.innerHTML = '<div><div class="who">tend</div><div class="bubble"></div></div>';
      var b = wrap.querySelector('.bubble');
      body.appendChild(wrap);
      bubble = b;
      return b;
    }

    function fail() {
      thinking.remove();
      replyCanned(text);
    }

    ensureConversation().then(function (convId) {
      return fetch('/api/chat/' + convId, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'same-origin',
        body: JSON.stringify({ message: text, history: chatHistory.slice(0, -1) })
      });
    })
    .then(function (r) {
      if (!r.ok || !r.body) throw new Error('http ' + r.status);
      var reader = r.body.getReader();
      var decoder = new TextDecoder();
      var buf = '';
      function pump() {
        return reader.read().then(function (res) {
          if (res.done) return;
          buf += decoder.decode(res.value, { stream: true });
          var lines = buf.split('\n');
          buf = lines.pop() || '';
          for (var i = 0; i < lines.length; i++) {
            var line = lines[i].trim();
            if (!line || !line.startsWith('data:')) continue;
            var payload = line.slice(5).trim();
            if (payload === '[DONE]') return;
            try {
              var obj = JSON.parse(payload);
              if (obj.error) throw new Error(obj.error);
              if (obj.delta) {
                ensureBubble();
                rawText += obj.delta;
                bubble.innerHTML = md(rawText);
                scroll();
              }
            } catch (e) {
              throw e;
            }
          }
          return pump();
        });
      }
      return pump();
    })
    .then(function () {
      if (rawText) chatHistory.push({ role: 'assistant', content: rawText });
      loadConversations();
    })
    .catch(function (e) {
      console.warn('replyLive error:', e);
      fail();
    });
  }

  function escapeHtml(s) {

      return '<div class="kpi-row' + (r.tall ? ' tall' : '') + '">' +

        '<div class="kpi-desc">' + r.desc + '</div>' +

      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'conv-item' + (c.id === activeConvId ? ' active' : '');
      btn.setAttribute('data-id', c.id);
      btn.innerHTML = '<span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;">' +
        escapeHtml(c.title || 'New chat') + '</span>';
      var del = document.createElement('button');
      del.type = 'button';
      del.className = 'conv-del';
      del.setAttribute('aria-label', 'Delete conversation');
      del.textContent = '×';
      del.addEventListener('click', function (e) {
        e.stopPropagation();
        if (!confirm('Delete this conversation?')) return;
        fetch('/api/conversations/' + c.id, { method: 'DELETE', credentials: 'same-origin' })
          .then(function () {
            if (activeConvId === c.id) {
              activeConvId = null;
              clearChat();
            }
            loadConversations();
          });
      });
      btn.appendChild(del);
      btn.addEventListener('click', function () { openConversation(c.id); });
      li.appendChild(btn);
      convListEl.appendChild(li);
    });
  }

  function escapeHtml(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function loadConversations() {
    fetch('/api/conversations', { credentials: 'same-origin' })
      .then(function (r) { return r.ok ? r.json() : { conversations: [] }; })
      .then(function (data) { renderConvList(data.conversations); });
  }

  function clearChat() {
    body.innerHTML = '';
    chatHistory = [];
    if (chatEmpty) {
      var tpl = chatEmpty.cloneNode(true);
      tpl.classList.remove('hidden');
      body.appendChild(tpl);
      chatEmpty = tpl;
    }
    if (homeBento) homeBento.classList.remove('hidden');
  }

  function openConversation(id) {
    fetch('/api/conversations/' + id, { credentials: 'same-origin' })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (data) {
        if (!data) return;
        activeConvId = id;
        clearChat();
        hideEmpty();
        chatHistory = [];
        data.conversation.messages.forEach(function (m) {
          if (m.role === 'user') {
            var wrap = el('div', 'msg user');
            wrap.innerHTML = '<div><div class="who">you</div><div class="bubble"></div></div>';
            wrap.querySelector('.bubble').textContent = m.content;
            body.appendChild(wrap);
            chatHistory.push({ role: 'user', content: m.content });
          } else {
            var wrap2 = el('div', 'msg');
            wrap2.innerHTML = '<div><div class="who">tend</div><div class="bubble">' + md(m.content) + '</div></div>';
            body.appendChild(wrap2);
            chatHistory.push({ role: 'assistant', content: m.content });
          }
        });
        scroll();
        loadConversations();
      });
  }

  if (newChatBtn) {
    newChatBtn.addEventListener('click', function () {
      activeConvId = null;
      clearChat();
      loadConversations();
      input.focus();
    });
  }

  loadConversations();
  setTimeout(function () { input.focus(); }, 100);
})();
</script>

</body>
</html>
