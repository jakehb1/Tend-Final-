<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>tend Workspace</title>
<script>
  (function () {
    var raw;
    try { raw = sessionStorage.getItem('tend.session'); } catch (_) { raw = null; }
    if (!raw) {
      window.location.replace('login.html');
    }
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="shared.css?v=4">
<style>
html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--fg);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* App top bar */
.app-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 24px;
  border-bottom: 1px solid var(--line);
  background: rgba(10,11,13,0.9);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  flex-shrink: 0;
}
.app-bar .left, .app-bar .right { display: flex; align-items: center; gap: 18px; }
.app-bar .brand img { height: 20px; width: auto; display: block; }
.app-bar .ws-tag {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 11px;
  color: var(--fg-mute);
  letter-spacing: 0.06em;
  border-left: 1px solid var(--line);
  padding-left: 18px;
}
.app-bar .ws-tag strong { color: var(--accent); font-weight: 500; }
.app-bar .user {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 12px;
  color: var(--fg-dim);
  letter-spacing: 0.02em;
}
.app-bar .logout {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 12px;
  color: var(--fg-mute);
  letter-spacing: 0.04em;
  text-decoration: none;
  padding: 6px 12px;
  border: 1px solid var(--line);
  transition: color 0.15s, border-color 0.15s;
}
.app-bar .logout:hover { color: var(--fg); border-color: var(--line-2); }

/* Layout */
.app-shell {
  flex: 1;
  display: grid;
  grid-template-columns: 280px 1fr;
  min-height: 0;
}

/* Sidebar */
.sidebar {
  border-right: 1px solid var(--line);
  background: var(--bg-2);
  overflow-y: auto;
  padding: 24px 0;
  display: flex;
  flex-direction: column;
  gap: 24px;
}
.sb-section { padding: 0 20px; }
.sb-section .h {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 10px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--fg-mute);
  margin-bottom: 12px;
  display: flex; justify-content: space-between; align-items: center;
}
.sb-section .h .count { color: var(--accent); }
.sys-list { display: flex; flex-direction: column; gap: 4px; }
.sys {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 10px;
  border: 1px solid transparent;
  font-size: 13.5px;
  color: var(--fg);
  letter-spacing: -0.005em;
  background: transparent;
  text-align: left;
  font-family: inherit;
  cursor: pointer;
  width: 100%;
  -webkit-appearance: none;
  appearance: none;
}
.sys:hover { border-color: var(--line); background: var(--bg-3); }
.sys .dot {
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--accent);
  flex-shrink: 0;
  box-shadow: 0 0 8px rgba(220,210,180,0.45);
}
.sys.idle .dot { background: var(--fg-mute); box-shadow: none; }
.sys.warn .dot { background: #C29A4D; box-shadow: 0 0 8px rgba(194,154,77,0.5); }
.sys .name { font-size: 13.5px; color: var(--fg); letter-spacing: -0.005em; }
.sys .meta { font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: var(--fg-mute); letter-spacing: 0.04em; }
.sys .sys-text { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.sys .sys-text .sub {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 10px;
  color: var(--fg-mute);
  letter-spacing: 0.03em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.sys.warn .sys-text .sub { color: #C29A4D; }

/* Today's activity panel */
.activity-list { display: flex; flex-direction: column; gap: 8px; }
.activity {
  display: flex;
  align-items: baseline;
  gap: 10px;
  padding: 6px 10px;
  border: 0;
  border-left: 2px solid var(--accent);
  background: var(--bg-3);
  text-align: left;
  font-family: inherit;
  width: 100%;
  cursor: pointer;
  -webkit-appearance: none;
  appearance: none;
  transition: background 0.12s;
}
.activity:hover { background: #1c2026; }
.activity.flag { border-left-color: #C29A4D; }
.activity .num {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 13px;
  color: var(--accent);
  font-weight: 500;
  letter-spacing: 0.02em;
  min-width: 30px;
}
.activity.flag .num { color: #C29A4D; }
.activity .label { font-size: 12px; color: var(--fg-dim); line-height: 1.35; }

.thread-list { display: flex; flex-direction: column; }
.thread {
  padding: 12px 12px;
  border: 0;
  border-left: 2px solid transparent;
  font-size: 13px;
  color: var(--fg-dim);
  cursor: pointer;
  line-height: 1.4;
  background: transparent;
  text-align: left;
  font-family: inherit;
  width: 100%;
  -webkit-appearance: none;
  appearance: none;
}
.thread:hover { color: var(--fg); background: var(--bg-3); }
.thread.active {
  background: var(--bg-3);
  border-left-color: var(--accent);
  color: var(--fg);
}
.thread .when {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 10px;
  color: var(--fg-mute);
  letter-spacing: 0.05em;
  margin-bottom: 4px;
}

/* Chat */
.chat {
  display: flex;
  flex-direction: column;
  min-height: 0;
  position: relative;
}
.chat-head {
  padding: 16px 28px;
  border-bottom: 1px solid var(--line);
  display: flex; justify-content: space-between; align-items: center;
  flex-shrink: 0;
}
.chat-head h1 {
  font-size: 18px;
  font-weight: 400;
  letter-spacing: -0.01em;
  margin: 0;
}
.chat-head .meta {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 11px;
  color: var(--fg-mute);
  letter-spacing: 0.05em;
}
.chat-head .meta .live { color: var(--accent); }

.chat-body {
  flex: 1;
  overflow-y: auto;
  padding: 32px 28px 24px;
  display: flex; flex-direction: column; gap: 24px;
}
.msg { display: flex; gap: 14px; max-width: 760px; }
.msg.user { align-self: flex-end; max-width: 540px; }
.msg .who {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 10px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--fg-mute);
  margin-bottom: 6px;
}
.msg.user .who { color: var(--accent); }
.msg .bubble {
  font-size: 15px;
  line-height: 1.6;
  color: var(--fg);
}
.msg.user .bubble {
  background: var(--bg-2);
  border: 1px solid var(--line);
  padding: 12px 16px;
}
.msg .bubble p { margin: 0 0 10px; }
.msg .bubble p:last-child { margin-bottom: 0; }
.msg .bubble strong { color: var(--accent); font-weight: 500; }

.sources {
  display: flex; flex-wrap: wrap; gap: 6px;
  margin-top: 12px;
}
.src {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 10px;
  letter-spacing: 0.06em;
  color: var(--fg-dim);
  border: 1px solid var(--line);
  padding: 4px 8px;
}
.src::before { content: "● "; color: var(--accent); }

.thinking {
  display: inline-flex; gap: 4px; align-items: center;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 12px;
  color: var(--fg-mute);
  letter-spacing: 0.04em;
}
.thinking .d {
  width: 4px; height: 4px; border-radius: 50%; background: var(--fg-mute);
  animation: pulse 1.2s infinite;
}
.thinking .d:nth-child(2) { animation-delay: 0.15s; }
.thinking .d:nth-child(3) { animation-delay: 0.3s; }
@keyframes pulse {
  0%, 100% { opacity: 0.3; }
  50% { opacity: 1; }
}

/* Composer */
.composer {
  border-top: 1px solid var(--line);
  padding: 16px 28px 20px;
  flex-shrink: 0;
  background: var(--bg);
}
.composer-inner {
  border: 1px solid var(--line-2);
  background: var(--bg-2);
  padding: 12px 14px;
  display: flex; gap: 12px; align-items: flex-end;
}
.composer textarea {
  flex: 1;
  background: transparent;
  border: 0;
  outline: 0;
  resize: none;
  color: var(--fg);
  font-family: 'FH Premier', 'IBM Plex Sans', system-ui, sans-serif;
  font-size: 15px;
  line-height: 1.5;
  min-height: 24px;
  max-height: 160px;
}
.composer textarea::placeholder { color: var(--fg-mute); }
.composer .send {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 12px;
  letter-spacing: 0.04em;
  background: var(--accent);
  color: var(--accent-ink);
  border: 1px solid var(--accent);
  padding: 7px 14px;
  cursor: pointer;
  -webkit-appearance: none;
  appearance: none;
  flex-shrink: 0;
}
.composer .send:hover { filter: brightness(1.08); }
.composer .hints {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 10px;
  color: var(--fg-mute);
  letter-spacing: 0.05em;
  margin-top: 8px;
  display: flex; flex-wrap: wrap; gap: 8px;
}
.hint {
  border: 1px solid var(--line);
  padding: 5px 9px;
  cursor: pointer;
  color: var(--fg-dim);
  background: transparent;
  font: inherit;
  letter-spacing: inherit;
}
.hint:hover { color: var(--fg); border-color: var(--line-2); }

.app-toggle {
  display: none;
  background: transparent;
  border: 1px solid var(--line-2);
  color: var(--fg);
  padding: 7px 10px;
  margin-right: 8px;
  cursor: pointer;
  -webkit-appearance: none;
  appearance: none;
  align-items: center;
  justify-content: center;
}
.app-toggle svg { display: block; }
.app-backdrop {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(10,11,13,0.65);
  backdrop-filter: blur(2px);
  z-index: 40;
}

@media (max-width: 880px) {
  .app-shell { grid-template-columns: 1fr; }
  .chat-body, .composer, .chat-head { padding-left: 18px; padding-right: 18px; }
  .app-bar .ws-tag { display: none; }
  .app-bar .user { display: none; }
  .app-bar .left { gap: 6px; }
  .app-toggle { display: inline-flex; }
  .sidebar {
    position: fixed;
    top: 0; left: 0; bottom: 0;
    width: min(86vw, 320px);
    z-index: 50;
    transform: translateX(-100%);
    transition: transform 0.22s ease;
    border-right: 1px solid var(--line);
    box-shadow: 12px 0 40px rgba(0,0,0,0.45);
  }
  body.drawer-open .sidebar { transform: translateX(0); }
  body.drawer-open .app-backdrop { display: block; }
}
</style>
</head>
<body>

<header class="app-bar">
  <div class="left">
    <button type="button" class="app-toggle" id="app-toggle" aria-controls="sidebar" aria-expanded="false" aria-label="Open sidebar">
      <svg width="18" height="14" viewBox="0 0 18 14" aria-hidden="true"><g stroke="currentColor" stroke-width="1.5" stroke-linecap="square"><line x1="0" y1="2" x2="18" y2="2"/><line x1="0" y1="7" x2="18" y2="7"/><line x1="0" y1="12" x2="18" y2="12"/></g></svg>
    </button>
    <a class="brand" href="index.html"><img src="images/tend-logo.png" alt="tend" /></a>
    <div class="ws-tag">WORKSPACE · <strong>kyros</strong></div>
  </div>
  <div class="right">
    <span class="user" id="user-email">you@company.com</span>
    <a href="#" id="logout" class="logout">Log out</a>
  </div>
</header>

<div class="app-shell">

  <div class="app-backdrop" id="app-backdrop" aria-hidden="true"></div>
  <aside class="sidebar" id="sidebar">
    <div class="sb-section">
      <div class="h"><span>Today's activity</span><span class="count">● LIVE</span></div>
      <div class="activity-list">
        <button type="button" class="activity" data-query="Show me the 6 follow-ups you drafted today"><span class="num">6</span><span class="label">follow-ups drafted</span></button>
        <button type="button" class="activity" data-query="Which renewals are at risk?"><span class="num">3</span><span class="label">renewals flagged at risk</span></button>
        <button type="button" class="activity" data-query="Which tickets did you route this morning?"><span class="num">11</span><span class="label">tickets auto-routed</span></button>
        <button type="button" class="activity" data-query="Show me today's invoice reconciliation"><span class="num">14</span><span class="label">invoices reconciled</span></button>
        <button type="button" class="activity flag" data-query="Tell me about the $94K duplicate billing you caught"><span class="num">$94K</span><span class="label">duplicate billing caught</span></button>
      </div>
    </div>

    <div class="sb-section">
      <div class="h"><span>Connected systems</span><span class="count">7 live</span></div>
      <div class="sys-list">
        <button type="button" class="sys" data-system="Salesforce"><span class="dot"></span><div class="sys-text"><div class="name">Salesforce</div><div class="sub">12,840 records · synced 2m ago</div></div></button>
        <button type="button" class="sys" data-system="HubSpot"><span class="dot"></span><div class="sys-text"><div class="name">HubSpot</div><div class="sub">7,210 contacts · synced 4m ago</div></div></button>
        <button type="button" class="sys" data-system="Zendesk"><span class="dot"></span><div class="sys-text"><div class="name">Zendesk</div><div class="sub">1,440 tickets · synced 1m ago</div></div></button>
        <button type="button" class="sys" data-system="NetSuite"><span class="dot"></span><div class="sys-text"><div class="name">NetSuite</div><div class="sub">8,920 records · synced 6m ago</div></div></button>
        <button type="button" class="sys" data-system="Stripe"><span class="dot"></span><div class="sys-text"><div class="name">Stripe</div><div class="sub">24,180 invoices · synced 2m ago</div></div></button>
        <button type="button" class="sys" data-system="Snowflake"><span class="dot"></span><div class="sys-text"><div class="name">Snowflake</div><div class="sub">118M rows · syncing now</div></div></button>
        <button type="button" class="sys" data-system="Slack"><span class="dot"></span><div class="sys-text"><div class="name">Slack</div><div class="sub">18 channels · synced 30s ago</div></div></button>
        <button type="button" class="sys warn" data-system="Gong"><span class="dot"></span><div class="sys-text"><div class="name">Gong</div><div class="sub">sync lagging 18m</div></div></button>
        <button type="button" class="sys idle" data-system="Notion"><span class="dot"></span><div class="sys-text"><div class="name">Notion</div><div class="sub">paused</div></div></button>
      </div>
    </div>

    <div class="sb-section">
      <div class="h"><span>Recent threads</span></div>
      <div class="thread-list" id="thread-list">
        <button type="button" class="thread active" data-thread="acme">
          <div class="when">TODAY · 09:41</div>
          What's going on with Acme Corp?
        </button>
        <button type="button" class="thread" data-thread="briefing">
          <div class="when">TODAY · 09:02</div>
          Morning briefing
        </button>
        <button type="button" class="thread" data-thread="renewals">
          <div class="when">TODAY · 08:12</div>
          Renewals at risk this quarter
        </button>
        <button type="button" class="thread" data-thread="arr">
          <div class="when">YESTERDAY</div>
          Why is Q3 ARR off by $84K?
        </button>
        <button type="button" class="thread" data-thread="northwind">
          <div class="when">YESTERDAY</div>
          Northwind redline status
        </button>
        <button type="button" class="thread" data-thread="tickets">
          <div class="when">FRI</div>
          Top 5 support escalations this week
        </button>
        <button type="button" class="thread" data-thread="helix">
          <div class="when">THU</div>
          What changed about Helix after the upgrade?
        </button>
      </div>
    </div>
  </aside>

  <main class="chat">
    <div class="chat-head">
      <h1 id="chat-title">What's going on with Acme Corp?</h1>
      <div class="meta">● <span class="live">LIVE</span> · grounded across 7 systems</div>
    </div>

    <div class="chat-body" id="chat-body"></div>

    <div class="composer">
      <form class="composer-inner" id="composer">
        <textarea id="msg-input" rows="1" placeholder="Ask anything across your connected systems…" autocomplete="off"></textarea>
        <button type="submit" class="send">Send →</button>
      </form>
      <div class="hints" id="hints">
        <button class="hint" type="button">Morning briefing</button>
        <button class="hint" type="button">Which renewals are at risk?</button>
        <button class="hint" type="button">Deals slipping this week</button>
        <button class="hint" type="button">What changed about Helix after the upgrade?</button>
        <button class="hint" type="button">Why is Q3 ARR off?</button>
      </div>
    </div>
  </main>

</div>

<script>
(function () {
  try {
    var raw = sessionStorage.getItem('tend.session');
    if (raw) {
      var sess = JSON.parse(raw);
      if (sess && sess.email) {
        document.getElementById('user-email').textContent = sess.email;
      }
    }
  } catch (_) {}

  var logout = document.getElementById('logout');
  if (logout) {
    logout.addEventListener('click', function (e) {
      e.preventDefault();
      try { sessionStorage.removeItem('tend.session'); } catch (_) {}
      window.location.href = 'index.html';
    });
  }

  var appToggle = document.getElementById('app-toggle');
  var backdrop = document.getElementById('app-backdrop');
  function setDrawer(open) {
    document.body.classList.toggle('drawer-open', open);
    if (appToggle) appToggle.setAttribute('aria-expanded', open ? 'true' : 'false');
  }
  if (appToggle) {
    appToggle.addEventListener('click', function () {
      setDrawer(!document.body.classList.contains('drawer-open'));
    });
  }
  if (backdrop) {
    backdrop.addEventListener('click', function () { setDrawer(false); });
  }
  document.querySelectorAll('#sidebar .thread, #sidebar .sys').forEach(function (n) {
    n.addEventListener('click', function () { setDrawer(false); });
  });

  var body = document.getElementById('chat-body');
  var form = document.getElementById('composer');
  var input = document.getElementById('msg-input');
  var hints = document.getElementById('hints');

  function scroll() { body.scrollTop = body.scrollHeight; }

  function el(tag, className, html) {
    var n = document.createElement(tag);
    if (className) n.className = className;
    if (html != null) n.innerHTML = html;
    return n;
  }

  function addUser(text) {
    var wrap = el('div', 'msg user');
    wrap.innerHTML = '<div><div class="who">you</div><div class="bubble"></div></div>';
    wrap.querySelector('.bubble').textContent = text;
    body.appendChild(wrap);
    scroll();
  }

  function addThinking() {
    var wrap = el('div', 'msg');
    wrap.innerHTML = '<div><div class="who">tend</div><div class="bubble"><span class="thinking">reading across connected systems<span class="d"></span><span class="d"></span><span class="d"></span></span></div></div>';
    body.appendChild(wrap);
    scroll();
    return wrap;
  }

  function addReply(html, sources) {
    var wrap = el('div', 'msg');
    var srcHTML = (sources || []).map(function (s) { return '<div class="src">' + s + '</div>'; }).join('');
    wrap.innerHTML = '<div><div class="who">tend</div><div class="bubble">' + html + (srcHTML ? '<div class="sources">' + srcHTML + '</div>' : '') + '</div></div>';
    body.appendChild(wrap);
    scroll();
  }

  var canned = [
    {
      match: /morning|brief|today|standup|what.*happen|what.*change/i,
      html: '<p>Good morning. Here\'s what changed since you logged off yesterday at 6:42 PM:</p><p><strong>Revenue.</strong> Two deals advanced overnight: <em>Helix</em> moved to Closed-Won ($140K, Diego signed at 11:48 PM), <em>Orbit Labs</em> moved to Procurement. One slipped: <em>Vela Health</em> pushed their decision out two weeks. Three new inbound leads from G2, all routed to AEs.</p><p><strong>Support.</strong> 11 tickets came in overnight. The agents auto-resolved 6, drafted responses for 4 (awaiting human review), and escalated 1 P1 (Acme Corp SAML SSO, now 18h open).</p><p><strong>Finance.</strong> 14 invoices auto-reconciled against NetSuite. Caught a <strong>$94K duplicate billing</strong> error where Stripe charged Brightline twice on Apr 24. Refund queued, pending your approval.</p><p><strong>Risk.</strong> Renewal risk model flagged 3 accounts (Acme, Northwind, Glasshouse). Acme is the most acute, details in our 9:41 thread.</p>',
      sources: ['Salesforce · overnight', 'Zendesk · 11 tickets', 'Stripe · 14 invoices', 'Slack · #revenue', 'Policy · risk-model.v4']
    },
    {
      match: /slip|stall|behind/i,
      html: '<p>Five deals are slipping this week (>7 days without movement on a stage they normally clear in 3):</p><p><strong>Acme Corp</strong> · $420K · Negotiation, day 14 · Maya Chen<br/><strong>Northwind</strong> · $180K · Legal review, day 9 · Diego Vargas<br/><strong>Vela Health</strong> · $96K · Procurement, day 11 · Sarah Park<br/><strong>Orbit Labs</strong> · $310K · Security review, day 8 · James O\'Connell<br/><strong>Hartwell</strong> · $58K · Awaiting signature, day 12 · Anjali Mehta</p><p>I\'ve already drafted nudges for all five owners. Want to review them before they send at 2 PM?</p>',
      sources: ['Salesforce · 5 opps', 'Gong · 12 calls', 'Policy · revops/slip-detector.v3']
    },
    {
      match: /renewal.*risk|risk.*renewal|churn|at risk/i,

    reply(text);
  });

  });

  function renderThread(id) {
    var t = THREADS[id];
    if (!t) return;
    document.getElementById('chat-title').textContent = t.title;
    body.innerHTML = '';
    t.messages.forEach(function (m) {
      if (m.who === 'user') {
        addUser(m.text);
      } else {
        addReply(m.html, m.sources);
      }
    });
    document.querySelectorAll('#thread-list .thread').forEach(function (n) {
      n.classList.toggle('active', n.getAttribute('data-thread') === id);
    });
    body.scrollTop = 0;
  }

  // Thread switching
  var threadList = document.getElementById('thread-list');
  if (threadList) {
    threadList.addEventListener('click', function (e) {
      var t = e.target.closest('.thread');
      if (!t) return;
      var id = t.getAttribute('data-thread');
      if (id) renderThread(id);
    });
  }

  // Connected systems -> ask about that system
  var sysList = document.querySelector('.sys-list');
