<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>tend Workspace</title>
<script>
  (function () {
    var raw;
    try { raw = sessionStorage.getItem('tend.session'); } catch (_) { raw = null; }
    if (!raw) {
      window.location.replace('login.html');
    }
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="shared.css?v=5">
<style>
html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--fg);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* App top bar */
.app-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 24px;
  border-bottom: 1px solid var(--line);
  background: rgba(10,11,13,0.9);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  flex-shrink: 0;
}
.app-bar .left, .app-bar .right { display: flex; align-items: center; gap: 18px; }
.app-bar .brand img { height: 20px; width: auto; display: block; }
.app-bar .ws-tag {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 11px;
  color: var(--fg-mute);
  letter-spacing: 0.06em;
  border-left: 1px solid var(--line);
  padding-left: 18px;
}
.app-bar .ws-tag strong { color: var(--accent); font-weight: 500; }
.app-bar .user {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 12px;
  color: var(--fg-dim);
  letter-spacing: 0.02em;
}
.app-bar .logout {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 12px;
  color: var(--fg-mute);
  letter-spacing: 0.04em;
  text-decoration: none;
  padding: 6px 12px;
  border: 1px solid var(--line);
  transition: color 0.15s, border-color 0.15s;
}
.app-bar .logout:hover { color: var(--fg); border-color: var(--line-2); }

/* Tune-view button + popover */
.app-bar .tune {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 12px;
  color: var(--fg-mute);
  letter-spacing: 0.04em;
  background: transparent;
  border: 1px solid var(--line);
  padding: 6px 12px;
  cursor: pointer;
  transition: color 0.15s, border-color 0.15s;
  -webkit-appearance: none;
  appearance: none;
}
.app-bar .tune:hover { color: var(--fg); border-color: var(--line-2); }
.tune-pop {
  position: absolute;
  top: 56px;
  right: 24px;
  width: 320px;
  background: var(--bg-2);
  border: 1px solid var(--line);
  box-shadow: 0 14px 40px rgba(0,0,0,0.4);
  padding: 18px;
  z-index: 60;
  display: none;
  font-family: 'IBM Plex Sans', sans-serif;
}
.tune-pop.open { display: block; }
.tune-pop h4 {
  margin: 0 0 8px;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 10.5px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--fg-mute);
  font-weight: 500;
}
.tune-pop .tune-row { margin-bottom: 16px; }
.tune-pop .tune-row:last-child { margin-bottom: 0; }
.tune-pop .pills { display: flex; flex-wrap: wrap; gap: 6px; }
.tune-pop .pill {
  font-family: 'IBM Plex Sans', sans-serif;
  font-size: 12.5px;
  color: var(--fg-dim);
  background: transparent;
  border: 1px solid var(--line);
  padding: 6px 10px;
  cursor: pointer;
  -webkit-appearance: none;
  appearance: none;
  transition: color 0.12s, border-color 0.12s, background 0.12s;
}
.tune-pop .pill:hover { color: var(--fg); border-color: var(--line-2); }
.tune-pop .pill.on {
  color: var(--bg);
  background: var(--fg);
  border-color: var(--fg);
}
.chat-head .tuned {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 10.5px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--fg-mute);
  margin-left: 10px;
  padding: 2px 8px;
  border-left: 1px solid var(--line);
}
.chat-head .tuned::before { content: "●"; color: var(--accent); font-size: 8px; }

/* Layout */
.app-shell {
  flex: 1;
  display: grid;
  grid-template-columns: 280px 1fr;
  min-height: 0;
}

/* Sidebar */
.sidebar {
  border-right: 1px solid var(--line);
  background: var(--bg-2);
  overflow-y: auto;
  padding: 24px 0;
  display: flex;
  flex-direction: column;
  gap: 24px;
}
.sb-section { padding: 0 20px; }
.sb-section .h {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 10px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--fg-mute);
  margin-bottom: 12px;
  display: flex; justify-content: space-between; align-items: center;
}
.sb-section .h .count { color: var(--accent); }
.sys-list { display: flex; flex-direction: column; gap: 4px; }
.sys {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 10px;
  border: 1px solid transparent;
  font-size: 13.5px;
  color: var(--fg);
  letter-spacing: -0.005em;
  background: transparent;
  text-align: left;
  font-family: inherit;
  cursor: pointer;
  width: 100%;
  -webkit-appearance: none;
  appearance: none;
}
.sys:hover { border-color: var(--line); background: var(--bg-3); }
.sys .dot {
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--accent);
  flex-shrink: 0;
  box-shadow: 0 0 8px rgba(220,210,180,0.45);
}
.sys.idle .dot { background: var(--fg-mute); box-shadow: none; }
.sys.warn .dot { background: #C29A4D; box-shadow: 0 0 8px rgba(194,154,77,0.5); }
.sys .name { font-size: 13.5px; color: var(--fg); letter-spacing: -0.005em; }
.sys .meta { font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: var(--fg-mute); letter-spacing: 0.04em; }
.sys .sys-text { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.sys .sys-text .sub {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 10px;
  color: var(--fg-mute);
  letter-spacing: 0.03em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.sys.warn .sys-text .sub { color: #C29A4D; }

/* Today's activity panel */
.activity-list { display: flex; flex-direction: column; gap: 8px; }
.activity {
  display: flex;
  align-items: baseline;
  gap: 10px;
  padding: 6px 10px;
  border: 0;
  border-left: 2px solid var(--accent);
  background: var(--bg-3);
  text-align: left;
  font-family: inherit;
  width: 100%;
  cursor: pointer;
  -webkit-appearance: none;
  appearance: none;
  transition: background 0.12s;
}
.activity:hover { background: #1c2026; }
.activity.flag { border-left-color: #C29A4D; }
.activity .num {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 13px;
  color: var(--accent);
  font-weight: 500;
  letter-spacing: 0.02em;
  min-width: 30px;
}
.activity.flag .num { color: #C29A4D; }
.activity .label { font-size: 12px; color: var(--fg-dim); line-height: 1.35; }

.sb-manage {
  display: block;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 11px;
  letter-spacing: 0.06em;
  color: var(--accent);
  text-decoration: none;
  padding: 12px 10px 4px;
  margin-top: 4px;
}
.sb-manage:hover { color: var(--fg); }

.thread-list { display: flex; flex-direction: column; }
.thread {
  padding: 12px 12px;
  border: 0;
  border-left: 2px solid transparent;
  font-size: 13px;
  color: var(--fg-dim);
  cursor: pointer;
  line-height: 1.4;
  background: transparent;
  text-align: left;
  font-family: inherit;
  width: 100%;
  -webkit-appearance: none;
  appearance: none;
}
.thread:hover { color: var(--fg); background: var(--bg-3); }
.thread.active {
  background: var(--bg-3);
  border-left-color: var(--accent);
  color: var(--fg);
}
.thread .when {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 10px;
  color: var(--fg-mute);
  letter-spacing: 0.05em;
  margin-bottom: 4px;
}

/* Chat */
.chat {
  display: flex;
  flex-direction: column;
  min-height: 0;
  position: relative;
}
.chat-head {
  padding: 16px 28px;
  border-bottom: 1px solid var(--line);
  display: flex; justify-content: space-between; align-items: center;
  flex-shrink: 0;
}
.chat-head h1 {
  font-size: 18px;
  font-weight: 400;
  letter-spacing: -0.01em;
  margin: 0;
}
.chat-head .meta {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 11px;
  color: var(--fg-mute);
  letter-spacing: 0.05em;
}
.chat-head .meta .live { color: var(--accent); }

.chat-body {
  flex: 1;
  overflow-y: auto;
  padding: 32px 28px 24px;
  display: flex; flex-direction: column; gap: 24px;
}
.msg { display: flex; gap: 14px; max-width: 760px; }
.msg.user { align-self: flex-end; max-width: 540px; }
.msg .who {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 10px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--fg-mute);
  margin-bottom: 6px;
}
.msg.user .who { color: var(--accent); }
.msg .bubble {
  font-size: 15px;
  line-height: 1.6;
  color: var(--fg);
}
.msg.user .bubble {
  background: var(--bg-2);
  border: 1px solid var(--line);
  padding: 12px 16px;
}
.msg .bubble p { margin: 0 0 10px; }
.msg .bubble p:last-child { margin-bottom: 0; }
.msg .bubble strong { color: var(--accent); font-weight: 500; }

.sources {
  display: flex; flex-wrap: wrap; gap: 6px;
  margin-top: 12px;
}
.src {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 10px;
  letter-spacing: 0.06em;
  color: var(--fg-dim);
  border: 1px solid var(--line);
  padding: 4px 8px;
}
.src::before { content: "● "; color: var(--accent); }

.thinking {
  display: inline-flex; gap: 4px; align-items: center;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 12px;
  color: var(--fg-mute);
  letter-spacing: 0.04em;
}
.thinking .d {
  width: 4px; height: 4px; border-radius: 50%; background: var(--fg-mute);
  animation: pulse 1.2s infinite;
}
.thinking .d:nth-child(2) { animation-delay: 0.15s; }
.thinking .d:nth-child(3) { animation-delay: 0.3s; }
@keyframes pulse {
  0%, 100% { opacity: 0.3; }
  50% { opacity: 1; }
}

/* Composer */
.composer {
  border-top: 1px solid var(--line);
  padding: 16px 28px 20px;
  flex-shrink: 0;
  background: var(--bg);
}
.composer-inner {
  border: 1px solid var(--line-2);
  background: var(--bg-2);
  padding: 12px 14px;
  display: flex; gap: 12px; align-items: flex-end;
}
.composer textarea {
  flex: 1;
  background: transparent;
  border: 0;
  outline: 0;
  resize: none;
  color: var(--fg);
  font-family: 'FH Premier', 'IBM Plex Sans', system-ui, sans-serif;
  font-size: 15px;
  line-height: 1.5;
  min-height: 24px;
  max-height: 160px;
}
.composer textarea::placeholder { color: var(--fg-mute); }
.composer .send {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 12px;
  letter-spacing: 0.04em;
  background: var(--accent);
  color: var(--accent-ink);
  border: 1px solid var(--accent);
  padding: 7px 14px;
  cursor: pointer;
  -webkit-appearance: none;
  appearance: none;
  flex-shrink: 0;
}
.composer .send:hover { filter: brightness(1.08); }
.composer .hints {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 10px;
  color: var(--fg-mute);
  letter-spacing: 0.05em;
  margin-top: 8px;
  display: flex; flex-wrap: wrap; gap: 8px;
}
.hint {
  border: 1px solid var(--line);
  padding: 5px 9px;
  cursor: pointer;
  color: var(--fg-dim);
  background: transparent;
  font: inherit;
  letter-spacing: inherit;
}
.hint:hover { color: var(--fg); border-color: var(--line-2); }

.app-toggle {
  display: none;
  background: transparent;
  border: 1px solid var(--line-2);
  color: var(--fg);
  padding: 7px 10px;
  margin-right: 8px;
  cursor: pointer;
  -webkit-appearance: none;
  appearance: none;
  align-items: center;
  justify-content: center;
}
.app-toggle svg { display: block; }
.app-backdrop {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(10,11,13,0.65);
  backdrop-filter: blur(2px);
  z-index: 40;
}

@media (max-width: 880px) {
  .app-shell { grid-template-columns: 1fr; }
  .chat-body, .composer, .chat-head { padding-left: 18px; padding-right: 18px; }
  .app-bar .ws-tag { display: none; }
  .app-bar .user { display: none; }
  .app-bar .left { gap: 6px; }
  .app-toggle { display: inline-flex; }
  .sidebar {
    position: fixed;
    top: 0; left: 0; bottom: 0;
    width: min(86vw, 320px);
    z-index: 50;
    transform: translateX(-100%);
    transition: transform 0.22s ease;
    border-right: 1px solid var(--line);
    box-shadow: 12px 0 40px rgba(0,0,0,0.45);
  }
  body.drawer-open .sidebar { transform: translateX(0); }
  body.drawer-open .app-backdrop { display: block; }
}
</style>
</head>
<body>

<header class="app-bar">
  <div class="left">
    <button type="button" class="app-toggle" id="app-toggle" aria-controls="sidebar" aria-expanded="false" aria-label="Open sidebar">
      <svg width="18" height="14" viewBox="0 0 18 14" aria-hidden="true"><g stroke="currentColor" stroke-width="1.5" stroke-linecap="square"><line x1="0" y1="2" x2="18" y2="2"/><line x1="0" y1="7" x2="18" y2="7"/><line x1="0" y1="12" x2="18" y2="12"/></g></svg>
    </button>
    <a class="brand" href="index.html"><img src="images/tend-logo.png" alt="tend" /></a>
    <div class="ws-tag">WORKSPACE · <strong>quiet golf</strong></div>
  </div>
  <div class="right">
    <button type="button" class="tune" id="tune-btn" aria-haspopup="true" aria-expanded="false">Tune view ▾</button>
    <span class="user" id="user-email">you@company.com</span>
    <a href="#" id="logout" class="logout">Log out</a>
  </div>
</header>

<div class="tune-pop" id="tune-pop" role="dialog" aria-label="Tune dashboard view">
  <div class="tune-row">
    <h4>How are you starting today?</h4>
    <div class="pills" data-tune="lens">
      <button type="button" class="pill" data-value="catch-up">Catch me up</button>
      <button type="button" class="pill" data-value="help-decide">Help me decide</button>
      <button type="button" class="pill" data-value="look-ahead">Look ahead</button>
      <button type="button" class="pill" data-value="brief">Just the brief</button>
    </div>
  </div>
  <div class="tune-row">
    <h4>What matters most this week?</h4>
    <div class="pills" data-tune="focus">
      <button type="button" class="pill" data-value="revenue">Revenue</button>
      <button type="button" class="pill" data-value="customers">Customers</button>
      <button type="button" class="pill" data-value="ops">Operations</button>
      <button type="button" class="pill" data-value="cash">Cash &amp; books</button>
    </div>
  </div>
  <div class="tune-row">
    <h4>Where do we begin?</h4>
    <div class="pills" data-tune="start">
      <button type="button" class="pill" data-value="brief">A morning brief</button>
      <button type="button" class="pill" data-value="account">A specific account</button>
      <button type="button" class="pill" data-value="dashboard">The dashboard</button>
      <button type="button" class="pill" data-value="question">A blank prompt</button>
    </div>
  </div>
</div>

<div class="app-shell">

  <div class="app-backdrop" id="app-backdrop" aria-hidden="true"></div>
  <aside class="sidebar" id="sidebar">
    <div class="sb-section">
      <div class="h"><span>Today's activity</span><span class="count">● LIVE</span></div>
      <div class="activity-list">
        <button type="button" class="activity" data-query="What orders came in overnight?"><span class="num">47</span><span class="label">orders overnight · $4,820</span></button>
        <button type="button" class="activity" data-query="What SKUs are running low?"><span class="num">3</span><span class="label">low-stock alerts</span></button>
        <button type="button" class="activity" data-query="What POs are awaiting approval?"><span class="num">4</span><span class="label">POs awaiting your approval</span></button>
        <button type="button" class="activity" data-query="When is the next Stripe payout?"><span class="num">$18.4K</span><span class="label">Stripe payout · Wednesday</span></button>
        <button type="button" class="activity flag" data-query="Tell me about the return request you flagged"><span class="num">1</span><span class="label">return request needs you</span></button>
      </div>
    </div>

    <div class="sb-section">
      <div class="h"><span>Connected systems</span><span class="count">7 live</span></div>
      <div class="sys-list">
        <button type="button" class="sys" data-system="Shopify"><span class="dot"></span><div class="sys-text"><div class="name">Shopify</div><div class="sub">2,840 orders · synced 2m ago</div></div></button>
        <button type="button" class="sys" data-system="Stripe"><span class="dot"></span><div class="sys-text"><div class="name">Stripe</div><div class="sub">payouts · synced 2m ago</div></div></button>
        <button type="button" class="sys" data-system="QuickBooks"><span class="dot"></span><div class="sys-text"><div class="name">QuickBooks</div><div class="sub">ledger · synced 8m ago</div></div></button>
        <button type="button" class="sys" data-system="ShipStation"><span class="dot"></span><div class="sys-text"><div class="name">ShipStation</div><div class="sub">fulfillment · synced 1m ago</div></div></button>
        <button type="button" class="sys" data-system="Stocky"><span class="dot"></span><div class="sys-text"><div class="name">Stocky</div><div class="sub">inventory · synced 12m ago</div></div></button>
        <button type="button" class="sys" data-system="Inventory Planner"><span class="dot"></span><div class="sys-text"><div class="name">Inventory Planner</div><div class="sub">forecasting · synced 18m ago</div></div></button>
        <button type="button" class="sys" data-system="Loop Returns"><span class="dot"></span><div class="sys-text"><div class="name">Loop Returns</div><div class="sub">38 returns · synced 6m ago</div></div></button>
      </div>
      <a href="connect.html" class="sb-manage">+ Connect more tools →</a>
    </div>

    <div class="sb-section">
      <div class="h"><span>Recent threads</span></div>
      <div class="thread-list" id="thread-list">
        <button type="button" class="thread active" data-thread="briefing">
          <div class="when">TODAY · 09:02</div>
          Morning briefing
        </button>
        <button type="button" class="thread" data-thread="bestsellers">
          <div class="when">TODAY · 08:48</div>
          What's selling best right now?
        </button>
        <button type="button" class="thread" data-thread="inventory">
          <div class="when">TODAY · 08:14</div>
          Which SKUs are running low?
        </button>
        <button type="button" class="thread" data-thread="shipping">
          <div class="when">YESTERDAY</div>
          Any shipping delays this week?
        </button>
        <button type="button" class="thread" data-thread="payouts">
          <div class="when">YESTERDAY</div>
          When is the next Stripe payout?
        </button>
        <button type="button" class="thread" data-thread="returns">
          <div class="when">FRI</div>
          What's our return rate this month?
        </button>
        <button type="button" class="thread" data-thread="books">
          <div class="when">THU</div>
          Where are we on May month-end?
        </button>
      </div>
    </div>
  </aside>

  <main class="chat">
    <div class="chat-head">
      <h1 id="chat-title">Morning briefing</h1>
      <div class="meta">● <span class="live">LIVE</span> · grounded across 7 systems<span class="tuned" id="tuned-pill" hidden></span></div>
    </div>

    <div class="chat-body" id="chat-body"></div>

    <div class="composer">
      <form class="composer-inner" id="composer">
        <textarea id="msg-input" rows="1" placeholder="Ask anything across your connected systems…" autocomplete="off"></textarea>
        <button type="submit" class="send">Send →</button>
      </form>
      <div class="hints" id="hints">
        <button class="hint" type="button">Morning briefing</button>
        <button class="hint" type="button">What's selling best right now?</button>
        <button class="hint" type="button">Which SKUs are running low?</button>
        <button class="hint" type="button">Any shipping delays this week?</button>
        <button class="hint" type="button">When is the next Stripe payout?</button>
      </div>
    </div>
  </main>

</div>

<!--
  Flip apiBase to your bridge URL (e.g. 'https://api.withtend.ai') to route
  the chat composer through OpenClaw via the bridge. Until then we keep
  the existing canned replies so the demo works on the static site.
-->
<script>
  window.__TEND_CONFIG__ = window.__TEND_CONFIG__ || { apiBase: null };
</script>
<script>
(function () {
  var CFG = window.__TEND_CONFIG__ || {};
  var API = CFG.apiBase || null;
  try {
    var raw = sessionStorage.getItem('tend.session');
    if (raw) {
      var sess = JSON.parse(raw);
      if (sess && sess.email) {
        document.getElementById('user-email').textContent = sess.email;
      }

  // Stream from the bridge /api/chat/:user SSE endpoint.
  // Each chunk arrives as {delta: "..."} and we append it to the bubble.
  function replyLive(text) {
    var userEmail = 'demo@withtend.ai';
    try {
      var sraw = sessionStorage.getItem('tend.session');
      if (sraw) {
        var s = JSON.parse(sraw);
        if (s && s.email) userEmail = s.email;
      }
    } catch (_) {}

    var thinking = addThinking();
    var bubble = null;

    function ensureBubble() {
      if (bubble) return bubble;
      thinking.remove();
      var wrap = document.createElement('div');
      wrap.className = 'msg';
      wrap.innerHTML = '<div><div class="who">tend</div><div class="bubble"></div></div>';
      var b = wrap.querySelector('.bubble');
      body.appendChild(wrap);
      bubble = b;
      return b;
    }

    function fail(msg) {
      thinking.remove();
      addReply('<p>Bridge unreachable. Falling back to demo mode.</p><p style="color:var(--fg-mute);font-size:12px;">' + msg + '</p>');
      replyCanned(text);
    }

    fetch(API + '/api/chat/' + encodeURIComponent(userEmail), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text })
    })
    .then(function (r) {
      if (!r.ok || !r.body) throw new Error('http ' + r.status);
      var reader = r.body.getReader();
      var decoder = new TextDecoder();
      var buf = '';
      function pump() {
        return reader.read().then(function (res) {
          if (res.done) return;
          buf += decoder.decode(res.value, { stream: true });
          var lines = buf.split('\n');
          buf = lines.pop() || '';
          for (var i = 0; i < lines.length; i++) {
            var line = lines[i].trim();
            if (!line || !line.startsWith('data:')) continue;
            var payload = line.slice(5).trim();
            if (payload === '[DONE]') return;
            try {
              var obj = JSON.parse(payload);
              if (obj.error) throw new Error(obj.error);
              if (obj.delta) {
                ensureBubble();
                bubble.textContent += obj.delta;
                scroll();
              }
            } catch (e) {
              throw e;
            }
          }
          return pump();
        });
      }
      return pump();
    })
    .catch(function (e) {
      console.warn('replyLive error:', e);
      fail(e.message || 'network error');
    });
  }

    sysList.addEventListener('click', function (e) {
      var s = e.target.closest('.sys');
      if (!s) return;
      var sys = s.getAttribute('data-system');
      if (!sys) return;
      input.value = "What's happening in " + sys + "?";
      form.requestSubmit();
    });
  }

  // Today's activity -> ask a follow-up about that item
  var activityList = document.querySelector('.activity-list');
  if (activityList) {
    activityList.addEventListener('click', function (e) {
      var a = e.target.closest('.activity');
      if (!a) return;
      var q = a.getAttribute('data-query');
      if (!q) return;
      input.value = q;
      form.requestSubmit();
    });
  }

  // ---------- Onboarding preferences ----------
  // Read from localStorage (written by /onboarding) and use them to
  // pick the default thread, reorder the sidebar, and surface a
  // "tuned for" pill. Editable inline via the Tune view popover.
  function loadPrefs() {
    try {
      var raw = localStorage.getItem('tend.onboarded');
      if (!raw) return { lens: 'catch-up', focus: 'ops', start: 'brief' };
      var p = JSON.parse(raw) || {};
      return {
        lens: p.lens || 'catch-up',
        focus: p.focus || 'ops',
        start: p.start || 'brief'
      };
    } catch (_) {
      return { lens: 'catch-up', focus: 'ops', start: 'brief' };
    }
  }
  function savePrefs(p) {
    try {
      var existing = JSON.parse(localStorage.getItem('tend.onboarded') || '{}');
      existing.lens = p.lens; existing.focus = p.focus; existing.start = p.start;
      existing.at = existing.at || Date.now();
      localStorage.setItem('tend.onboarded', JSON.stringify(existing));
    } catch (_) {}
  }

  var prefs = loadPrefs();

  // start + lens together pick which thread opens first.
  function threadForStart(p) {
    if (p.start === 'account')   return 'bestsellers';
    if (p.start === 'question')  return null;          // blank, focus input
    if (p.start === 'dashboard') return 'briefing';    // numbers-shaped briefing
    if (p.start === 'brief')     return 'briefing';
    // Fall back to lens when start is unset
    if (p.lens === 'help-decide') return 'inventory';
    if (p.lens === 'look-ahead')  return 'bestsellers';
    return 'briefing';
  }

  // Reorder the activity panel + connected-systems list by focus.
  var FOCUS_ACTIVITY_ORDER = {
    revenue:   ['orders', 'payout', 'pos', 'low-stock', 'return'],
    customers: ['return', 'orders', 'low-stock', 'payout', 'pos'],
    ops:       ['low-stock', 'pos', 'orders', 'payout', 'return'],
    cash:      ['payout', 'pos', 'orders', 'low-stock', 'return']
  };
  var FOCUS_SYS_ORDER = {
    revenue:   ['Shopify', 'Stripe', 'QuickBooks', 'Loop Returns', 'ShipStation', 'Stocky', 'Inventory Planner'],
    customers: ['Loop Returns', 'Shopify', 'Stripe', 'ShipStation', 'QuickBooks', 'Stocky', 'Inventory Planner'],
    ops:       ['Stocky', 'ShipStation', 'Inventory Planner', 'Shopify', 'Loop Returns', 'Stripe', 'QuickBooks'],
    cash:      ['Stripe', 'QuickBooks', 'Shopify', 'ShipStation', 'Stocky', 'Inventory Planner', 'Loop Returns']
  };
  function activityKey(btn) {
    var q = (btn.getAttribute('data-query') || '').toLowerCase();
    if (q.indexOf('orders came in') >= 0) return 'orders';
    if (q.indexOf('low') >= 0)            return 'low-stock';
    if (q.indexOf('po') >= 0)             return 'pos';
    if (q.indexOf('payout') >= 0)         return 'payout';
    if (q.indexOf('return') >= 0)         return 'return';
    return 'other';
  }
  function reorderList(container, getKey, order) {
    if (!container || !order) return;
    var items = Array.prototype.slice.call(container.children);
    items.sort(function (a, b) {
      var ai = order.indexOf(getKey(a)); var bi = order.indexOf(getKey(b));
      if (ai === -1) ai = 999; if (bi === -1) bi = 999;
      return ai - bi;
    });
    items.forEach(function (n) { container.appendChild(n); });
  }
  function applyPrefs(p) {
    reorderList(
      document.querySelector('.activity-list'),
      activityKey,
      FOCUS_ACTIVITY_ORDER[p.focus]
    );
    reorderList(
      document.querySelector('.sys-list'),
      function (el) { return el.getAttribute('data-system'); },
      FOCUS_SYS_ORDER[p.focus]
    );
    // "Tuned for" pill near the title
    var pill = document.getElementById('tuned-pill');
    if (pill) {
      var labelMap = {
        'catch-up': 'catch up', 'help-decide': 'decide', 'look-ahead': 'look ahead', 'brief': 'brief',
        'revenue': 'revenue', 'customers': 'customers', 'ops': 'operations', 'cash': 'cash',
        'account': 'account', 'dashboard': 'numbers', 'question': 'blank'
      };
      pill.textContent = 'Tuned: ' + (labelMap[p.lens] || p.lens)
        + ' · ' + (labelMap[p.focus] || p.focus)
        + ' · ' + (labelMap[p.start] || p.start);
      pill.hidden = false;
    }
    // Reflect current values in the popover pills
    document.querySelectorAll('#tune-pop .pills').forEach(function (group) {
      var key = group.getAttribute('data-tune');
      group.querySelectorAll('.pill').forEach(function (b) {
        b.classList.toggle('on', b.getAttribute('data-value') === p[key]);
      });
    });
  }

  // Wire the Tune view popover
  var tuneBtn = document.getElementById('tune-btn');
  var tunePop = document.getElementById('tune-pop');
  if (tuneBtn && tunePop) {
    tuneBtn.addEventListener('click', function (e) {
      e.stopPropagation();
      var open = tunePop.classList.toggle('open');
      tuneBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
    });
    document.addEventListener('click', function (e) {
      if (!tunePop.classList.contains('open')) return;
      if (tunePop.contains(e.target) || tuneBtn.contains(e.target)) return;
      tunePop.classList.remove('open');
      tuneBtn.setAttribute('aria-expanded', 'false');
    });
    tunePop.addEventListener('click', function (e) {
      var b = e.target.closest('.pill');
      if (!b) return;
      var group = b.closest('.pills');
      var key = group && group.getAttribute('data-tune');
      var val = b.getAttribute('data-value');
      if (!key || !val) return;
      prefs[key] = val;
      savePrefs(prefs);
      applyPrefs(prefs);
      // If they changed where to begin, jump the chat there too.
      if (key === 'start' || key === 'lens') {
        var t = threadForStart(prefs);
        if (t) renderThread(t);
        else {
          document.getElementById('chat-body').innerHTML = '';
          document.getElementById('chat-title').textContent = 'Ask anything';
          input.focus();
        }
      }
    });
  }

  // Initial render: apply prefs, then open the right thread.
  applyPrefs(prefs);
  var startThread = threadForStart(prefs);
  if (startThread) {
    renderThread(startThread);
  } else {
    document.getElementById('chat-title').textContent = 'Ask anything';
    setTimeout(function () { input.focus(); }, 50);
  }
})();
</script>

</body>
</html>
