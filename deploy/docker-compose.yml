name: tend

services:
  # tend app — main frontend + chat server (the thing you see in a browser)
  # Config is mounted as a volume so demo data swaps without rebuilding.
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PORT: 3000
      NODE_ENV: production
      # Pick which demo client to serve. Change DEMO_CLIENT in .env and
      # `docker compose restart app` — no rebuild needed.
      DEMO_CLIENT: ${DEMO_CLIENT:-quiet-golf}
      # Anthropic key for /api/chat. Without it the chat returns a friendly error.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      # Optional: persists conversations. Leave empty for ephemeral demo mode.
      DATABASE_URL: ${APP_DATABASE_URL:-}
      SESSION_SECRET: ${APP_SESSION_SECRET}
    volumes:
      # Mount config read-only so `bin/swap-demo.sh` on the host swaps
      # the demo without rebuilding the container.
      - ../config:/app/config:ro
    expose:
      - "3000"

  # Postgres for Nango (Nango requires Postgres for credential storage)
  nango-db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${NANGO_DB_PASSWORD}
      POSTGRES_USER: nango
      POSTGRES_DB: nango
    volumes:
      - nango_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nango -d nango"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Nango: OAuth + scheduled-sync engine
  nango-server:
    image: nangohq/nango-server:latest
    restart: unless-stopped
    depends_on:
      nango-db:
        condition: service_healthy
    environment:
      NANGO_DATABASE_URL: postgres://nango:${NANGO_DB_PASSWORD}@nango-db:5432/nango
      NANGO_ENCRYPTION_KEY: ${NANGO_ENCRYPTION_KEY}
      NANGO_SERVER_URL: ${NANGO_PUBLIC_URL}
      NANGO_PUBLIC_URL: ${NANGO_PUBLIC_URL}
      NANGO_DASHBOARD_USERNAME: ${NANGO_DASHBOARD_USERNAME}
      NANGO_DASHBOARD_PASSWORD: ${NANGO_DASHBOARD_PASSWORD}
      NANGO_WEBHOOK_URL: http://bridge:8000/api/webhooks/nango
    expose:
      - "3003"

  # tend bridge — small Node service the frontend talks to
  bridge:
    build: ../bridge
    restart: unless-stopped
    depends_on:
      - nango-server
      - hermes-sidecar
    environment:
      NANGO_HOST: http://nango-server:3003
      NANGO_SECRET_KEY: ${NANGO_SECRET_KEY}
      HERMES_SIDECAR_URL: http://hermes-sidecar:8500
      HERMES_AGENT_DEFAULT: ${HERMES_AGENT_DEFAULT}
      ALLOW_ORIGIN: ${ALLOW_ORIGIN}
      PORT: 8000
    volumes:
      - bridge_data:/data
    expose:
      - "8000"

  # Hermes agent runtime sidecar (Python, FastAPI + SSE)
  hermes-sidecar:
    build: ../bridge/hermes-sidecar
    restart: unless-stopped
    environment:
      HERMES_CONFIG_DIR: /var/lib/hermes/agents
      ALLOW_ORIGIN: ${ALLOW_ORIGIN}
    volumes:
      - hermes_data:/var/lib/hermes
      - ./agent-templates:/var/lib/hermes/templates:ro
    expose:
      - "8500"

  # Caddy: HTTPS, reverse proxy. Automatic Let's Encrypt cert.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
      - bridge
      - nango-server
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
      API_DOMAIN: ${API_DOMAIN}
      NANGO_DOMAIN: ${NANGO_DOMAIN}

volumes:
  nango_db_data:
  bridge_data:
  hermes_data:
  caddy_data:
  caddy_config:
